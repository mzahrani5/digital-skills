<title>بوابة المهارات الرقمية — المعلم ماجد بن أحمد الزهراني</title>
<style>
@font-face{font-family:"HNArabic";src:url(/assets/hn-b94b5ab84e.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"HNArabic";src:url(/assets/hn-f3d6c80308.woff) format("woff");font-weight:700;font-display:swap}
/* Layout: a single narrow column on a pixel-grid "digital notebook" ground; a navy subject band on top, lesson pages as stacked task sections. */
:root{
  --bg:#edf2f6; --surface:#ffffff; --surface-2:#f5f8fb; --ink:#14283d; --muted:#596b7d; --line:#d3dde6;
  --band:#16324f; --band-ink:#f3f7fb; --band-muted:#a9bfd3;
  --accent:#e8692f; --accent-ink:#ffffff; --teal:#17806f; --sun:#f6c445;
  --ok:#17844e; --ok-bg:#e1f4e8; --bad:#c93b3b; --bad-bg:#fbe4e4;
  --wa:#1f9d55; --grid:rgba(22,50,79,.055);
  --doc:#ffffff; --doc-ink:#1b1b1b; --doc-line:#d9d9d9;
  --motion:#3e7fd6; --pen:#22a06b; --control:#e59a1f;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1923; --surface:#152331; --surface-2:#1a2b3b; --ink:#e5edf4; --muted:#9db1c3; --line:#26394b;
  --band:#0b2136; --band-ink:#f0f5fa; --band-muted:#8fa9c0;
  --accent:#ff8650; --accent-ink:#1a0c04; --teal:#3fc2ab; --sun:#f6c445;
  --ok:#45d08a; --ok-bg:#143628; --bad:#ff7a7a; --bad-bg:#3b1c1f;
  --wa:#2fbf6c; --grid:rgba(229,237,244,.045);
  --motion:#5b97e8; --pen:#36b981; --control:#eaa634;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1923; --surface:#152331; --surface-2:#1a2b3b; --ink:#e5edf4; --muted:#9db1c3; --line:#26394b;
  --band:#0b2136; --band-ink:#f0f5fa; --band-muted:#8fa9c0;
  --accent:#ff8650; --accent-ink:#1a0c04; --teal:#3fc2ab; --sun:#f6c445;
  --ok:#45d08a; --ok-bg:#143628; --bad:#ff7a7a; --bad-bg:#3b1c1f;
  --wa:#2fbf6c; --grid:rgba(229,237,244,.045);
  --motion:#5b97e8; --pen:#36b981; --control:#eaa634;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
#app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.band{background:var(--band);color:var(--band-ink);border-radius:20px;padding:22px 20px 18px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto auto -1px -1px;width:120px;height:72px;
  background:conic-gradient(from 90deg at 0 0,transparent 0 0) ,
  linear-gradient(var(--accent),var(--accent)) 0 48px/24px 24px no-repeat,
  linear-gradient(var(--sun),var(--sun)) 24px 48px/24px 24px no-repeat,
  linear-gradient(var(--teal),var(--teal)) 0 24px/24px 24px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 48px 48px/24px 24px no-repeat;opacity:.9}
.eyebrow{font-size:13px;letter-spacing:.02em;color:var(--band-muted);font-weight:600}
.teacher-band{background:linear-gradient(135deg,#0f5c52,#17806f)}.teacher-band .grade{color:#ffe39a}
.band h1{font-size:clamp(30px,8vw,44px);font-weight:800;margin-top:2px}
.band .grade{font-size:17px;font-weight:600;color:var(--sun)}
.ids{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px;padding-inline-end:70px}
.id{display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}
.id small{font-size:12px;color:var(--band-muted)}
.id b{font-weight:600;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select,textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:96px;resize:vertical;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none;min-height:46px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn.teal{background:var(--teal);color:var(--surface)}
.btn.wa{background:var(--wa);color:#fff;font-size:17px}
.btn[aria-disabled=true],.btn:disabled{opacity:.45;pointer-events:none}
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-t h2{font-size:22px}
.sec-t .tag{margin-inline-start:auto}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* student */
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--sun);color:#3d2a00;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;flex:none}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--band);color:var(--band-ink)}

.unit{display:flex;flex-direction:column;gap:8px}
.unit-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.unit-n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent)}
.unit-h h3{font-size:20px}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.lesson:hover{border-color:var(--accent)}
.lesson .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1.5px dashed var(--line);font-weight:800;font-size:14px;color:var(--muted)}
.lesson.done .dot{background:var(--ok-bg);border:1.5px solid var(--ok);color:var(--ok)}
.lesson.proj{background:var(--surface-2)}
.lesson small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.lesson b{font-weight:700;font-size:16px;display:block;min-width:0}
.lesson .score{font-weight:800;color:var(--ok);font-size:14px}

/* lesson page */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.l-head{display:flex;flex-direction:column;gap:6px}
.l-head .meta{font-size:13px;font-weight:700;color:var(--accent)}
.l-head h1{font-size:clamp(28px,7vw,38px);font-weight:800}
.l-head .ctx{font-size:13px;color:var(--muted)}
.idea{background:var(--surface-2);border-inline-start:4px solid var(--sun);border-radius:10px;padding:12px 14px}
.idea b{display:block;font-size:13px;color:var(--muted)}
.intro{margin-bottom:12px;font-weight:500}
.hint{font-size:14px;color:var(--muted)}
.msg{font-weight:700;font-size:15px;min-height:1.7em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.goals li{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.goals li::before{content:"";flex:none;width:16px;height:16px;margin-top:5px;border-radius:5px;border:2px solid var(--line)}
.goals li.on{color:var(--ink)}
.goals li.on::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--surface)}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.q+.q{border-top:1px dashed var(--line);padding-top:14px}
.q-t{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:start;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.opt.sel{border-color:var(--band);background:color-mix(in srgb,var(--band) 10%,var(--surface));font-weight:700}
.hs-tap{animation:pop .35s;outline:3px solid var(--band)!important;outline-offset:1px}
.goals.plain li::before{width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--muted);border:0}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);font-weight:700}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}

/* sort */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pool{padding:10px;border-radius:12px;background:var(--surface-2);min-height:48px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:15px;text-align:start}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg)} .chip.bad{border-color:var(--bad);background:var(--bad-bg)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
.bucket{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:90px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.bucket.ready{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.bucket-t{font-weight:800;font-family:var(--f-display);font-size:17px}

/* order */
.olist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:o}
.olist li{counter-increment:o;display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.olist li::before{content:counter(o);font-weight:800;color:var(--accent);min-width:1.2em}
.olist li.ok{border-color:var(--ok);background:var(--ok-bg)} .olist li.bad{border-color:var(--bad);background:var(--bad-bg)}
.olist .empty{border-style:dashed;color:var(--muted);font-weight:500}
.olist .empty::before{content:""}

/* scenes */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.prompt{font-weight:700;font-size:16px;background:var(--band);color:var(--band-ink);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.hs-ok{animation:pop .5s;outline:3px solid #2fbf6c!important;outline-offset:1px}
.hs-bad{animation:shake .4s;outline:3px solid #e05050!important}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.desk{border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 75% 110%,#7ec8ff 0,#3d8fe0 30%,transparent 60%),radial-gradient(90% 80% at 15% 0%,#2a5fb8 0,transparent 60%),linear-gradient(160deg,#0f2d6b,#1d5bbf 55%,#58a8f0);display:flex;flex-direction:column;aspect-ratio:16/10;max-width:100%;border:3px solid #10243a;min-height:240px}
.desk-icons{flex:1;display:grid;grid-template-columns:repeat(auto-fill,76px);grid-auto-rows:min-content;gap:8px;padding:10px;align-content:start}
.d-icon{background:transparent;border:0;border-radius:8px;color:#fff;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.d-icon:hover{background:rgba(255,255,255,.18)}
.d-ic svg{width:42px;height:42px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.taskbar{background:rgba(24,34,48,.82);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:4px;padding:5px 6px;color:#e6eef5}
.tb{background:transparent;border:0;border-radius:6px;padding:4px 5px;white-space:nowrap;flex:none;color:#e6eef5;display:flex;align-items:center;gap:4px;font-size:12px;min-height:34px}
.tb svg{width:24px;height:24px}.tb:hover{background:rgba(255,255,255,.12)}
.tb.search{background:rgba(255,255,255,.14);flex:0 1 90px;color:#d6e1ec;border-radius:99px;padding-inline:12px}
.tb-gap{flex:1;min-width:4px}@media (max-width:480px){.tb.pin{display:none}}.tb.clock{flex-direction:column;gap:0;line-height:1.2;font-size:11px}.tb.clock small{font-size:9.5px;opacity:.85}
.kbd{direction:ltr;display:flex;flex-direction:column;gap:6px;background:linear-gradient(#3a4552,#252e38);padding:10px;border-radius:14px;min-width:600px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.25)}
.krow{display:flex;gap:5px}
.key{flex:1 1 0;min-width:0;height:44px;border-radius:8px;border:0;background:linear-gradient(#ffffff,#e3e9ef);color:#1b2733;font-weight:700;font-size:15px;box-shadow:0 3px 0 #8996a4,0 4px 6px rgba(0,0,0,.25);transition:transform .08s}.key:active{transform:translateY(2px);box-shadow:0 1px 0 #8996a4}
.key.fn{background:linear-gradient(#e6ecf2,#cdd7e1);font-size:12px}
table.sheet{border-collapse:collapse;direction:rtl;font-variant-numeric:tabular-nums;background:#fff;color:#1b1b1b}
.sheet th{background:#e9eef3;color:#3c4c5c;font-weight:600;font-size:13px;border:1px solid #c5cfd8;padding:4px 8px;min-width:26px}
.sheet td{border:1px solid #d5dde5;min-width:70px;height:34px;padding:0;font-size:14px;text-align:center}
.sheet td[data-hs]{cursor:pointer}
.sheet td input{width:100%;min-width:74px;height:34px;border:0;background:transparent;text-align:center;padding:0 4px;box-sizing:border-box;color:var(--doc-ink)}
.sheet td input:focus{outline:none;background:#f6fbf8}
.sheet td input[readonly]{font-weight:600;color:#2a3a4a}
.fbar{display:flex;gap:6px;align-items:center;direction:ltr;margin-bottom:6px;font-size:14px;background:#fff;border:1px solid #d6dbe0;padding:4px;border-radius:4px}.fbar .fx{font-style:italic;font-weight:700;color:#555}
.fbar b{background:#fff;border:1px solid #d6dbe0;color:#1b1b1b;border-radius:6px;padding:2px 10px;min-width:40px;text-align:center}
.fbar span{flex:1;border:1px solid #d6dbe0;border-radius:3px;padding:2px 10px;background:#fff;color:#1b1b1b;min-height:1.7em;overflow:hidden;white-space:nowrap}

/* settings */
.mini{border-radius:12px;border:4px solid #10243a;aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;transition:background .3s,filter .3s}
.mini .win{position:absolute;inset:16% 18% 24% 18%;border-radius:8px;padding:8px;font-size:12px;transition:background .3s,color .3s}
.mini .vol{position:absolute;bottom:8px;left:8px;right:8px;height:8px;border-radius:9px;background:rgba(0,0,0,.25)}
.mini .vol i{display:block;height:100%;border-radius:9px;background:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:10px;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 12px;font-weight:600;min-height:38px}
.seg button[aria-pressed=true]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:12px}
.ctrl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctrl>span{font-size:13px;font-weight:700;color:var(--muted)}

/* doc */
.doc{background:var(--doc);color:var(--doc-ink);border:1px solid var(--doc-line);border-radius:6px;padding:22px 20px;min-height:120px;box-shadow:0 2px 0 var(--doc-line)}
.doc p,.doc li{margin:0}
.doc ul{margin:0;padding-inline-start:22px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.tbtn{min-width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 10px}
.tbtn[aria-pressed=true]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.tsep{width:1px;background:var(--line);margin-inline:2px}
.words{display:flex;flex-wrap:wrap;gap:6px;font-size:18px;margin-top:8px}
.words span{padding:1px 8px;border-radius:6px}
.words .ok{background:var(--ok-bg);color:var(--ok)} .words .bad{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}

/* code */
.code{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.code{grid-template-columns:1fr 1fr}}
.stage{position:relative;display:grid;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;overflow:hidden;max-width:100%;max-height:380px;margin-inline:auto;width:100%}
.cell{border:1px solid var(--line);display:grid;place-items:center}
.cell svg{width:70%;height:70%}
.cell.wall{background:repeating-linear-gradient(45deg,var(--muted) 0 6px,var(--line) 6px 12px)}
.sprite{position:absolute;top:0;left:0;transition:transform .32s ease;display:grid;place-items:center;pointer-events:none}
.sprite .in{width:82%;height:82%;transition:transform .3s;display:block}
.sprite svg{width:100%;height:100%;display:block}
.sprite.bump .in{animation:shake .35s}
.palette{display:flex;flex-wrap:wrap;gap:6px}

/* ================= التصميم الحديث v2 ================= */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f1f4f9; --ink:#0f1b2d; --muted:#5f6f86; --line:#e3e8f0;
  --band:#0f1b2d; --band-ink:#ffffff; --band-muted:rgba(255,255,255,.78);
  --brand1:#1d6fb8; --brand2:#1f9e8a; --brand3:#3fb37a;
  --accent:#1d6fb8; --accent-ink:#ffffff; --teal:#1f9e8a; --sun:#ffc94a;
  --ok:#159a5b; --ok-bg:#e6f7ee; --bad:#d64545; --bad-bg:#fdecec;
  --wa:#159a5b; --grid:transparent;
  --f-display:"HNArabic",Tahoma,"Segoe UI",sans-serif; --f-body:"HNArabic",Tahoma,"Segoe UI",sans-serif;
  --r:22px; --shadow:0 1px 2px rgba(15,27,45,.05),0 10px 30px -12px rgba(15,27,45,.14);
  --grad:linear-gradient(135deg,var(--brand1),var(--brand2) 60%,var(--brand3));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1120; --surface:#111a2c; --surface-2:#172238; --ink:#e9eef7; --muted:#97a6bd; --line:#223049;
  --brand1:#3b8fdb; --brand2:#2bb59d; --brand3:#55c98f; --accent:#4c9be3; --accent-ink:#06121f; --teal:#2bb59d;
  --ok:#3fd18a; --ok-bg:#10321f; --bad:#ff7a7a; --bad-bg:#3a1a1d; --wa:#2fbf6c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1120; --surface:#111a2c; --surface-2:#172238; --ink:#e9eef7; --muted:#97a6bd; --line:#223049;
  --brand1:#3b8fdb; --brand2:#2bb59d; --brand3:#55c98f; --accent:#4c9be3; --accent-ink:#06121f; --teal:#2bb59d;
  --ok:#3fd18a; --ok-bg:#10321f; --bad:#ff7a7a; --bad-bg:#3a1a1d; --wa:#2fbf6c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.6);color-scheme:dark}
html,body{font-family:var(--f-body)}
body{background:var(--bg);background-image:radial-gradient(60% 40% at 100% 0%,color-mix(in srgb,var(--brand1) 14%,transparent),transparent 70%),radial-gradient(50% 35% at 0% 100%,color-mix(in srgb,var(--brand3) 12%,transparent),transparent 70%);background-repeat:no-repeat;background-size:100% 900px,100% 100%;-webkit-font-smoothing:antialiased}
#app{max-width:780px;padding-block:18px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.stack{gap:18px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand1) 55%,transparent);outline-offset:2px}

/* الرأس */
.band{background:var(--grad);color:#fff;border-radius:28px;padding:22px 22px 20px;box-shadow:0 18px 40px -18px color-mix(in srgb,var(--brand1) 70%,transparent);isolation:isolate}
.band::after{inset:0;width:auto;height:auto;opacity:.22;z-index:-1;background:radial-gradient(circle,#fff 1.6px,transparent 2px) 0 0/22px 22px;mask-image:linear-gradient(115deg,transparent 35%,#000 100%);-webkit-mask-image:linear-gradient(115deg,transparent 35%,#000 100%)}
.band-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.band .eyebrow{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:700;letter-spacing:0}
.moe{background:#fff;border-radius:18px;padding:8px 12px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.14);flex:0 0 auto}.moe img{height:64px;width:auto;display:block}
.band.compact .moe img{height:54px}
.band h1{font-size:clamp(30px,8vw,46px);font-weight:700;margin-top:4px;color:#fff}
.band .grade{color:rgba(255,255,255,.9);font-weight:400;font-size:17px}
.ids{padding-inline-end:0;gap:10px;margin-top:16px}
.id{border:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:10px 14px}
.id small{color:rgba(255,255,255,.75)}.id b{font-weight:700}
.teacher-band{background:linear-gradient(135deg,#4338ca,#6d28d9 55%,#a21caf)}
.teacher-band .grade{color:rgba(255,255,255,.9)}

/* البطاقات */
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.sec-t{margin-bottom:14px}.sec-t h2{font-size:21px}
.tag{background:color-mix(in srgb,var(--brand1) 10%,var(--surface));color:var(--brand1);border:0;font-weight:700;padding:4px 12px}

/* الأزرار */
.btn{border-radius:14px;background:var(--grad);color:#fff;font-weight:700;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--brand1) 80%,transparent);transition:transform .15s,box-shadow .15s,filter .15s;min-height:48px;padding:11px 20px}
.btn:hover{transform:translateY(-1px);filter:saturate(1.1)}.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:700}
.btn.teal{background:linear-gradient(135deg,var(--brand2),var(--brand3));color:#fff}
.btn.wa{background:linear-gradient(135deg,#12a35f,#1fbf7a);font-size:17px;box-shadow:0 10px 22px -12px #12a35f}
.btn[aria-disabled=true],.btn:disabled{opacity:.4;filter:grayscale(.4)}
.back{color:var(--muted);font-weight:700}.back:hover{color:var(--brand1)}

/* الحقول */
input[type=text],input[type=number],select,textarea{background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;transition:border-color .15s,background .15s}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand1);background:var(--surface)}
.field label{font-weight:700;font-size:13px}

/* التبويبات */
.tabs{background:var(--surface-2);border:0;border-radius:18px;padding:6px;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button{border-radius:14px;padding:11px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--brand1);box-shadow:var(--shadow)}

/* الترحيب والتقدم */
.avatar{background:var(--grad);color:#fff;border-radius:16px;width:48px;height:48px;font-weight:700}
.bar{height:12px;border:0;background:var(--surface-2)}.bar i{background:var(--grad)}

.nl-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--brand1,#1d6fb8) 8%,var(--surface)),var(--surface))}.nl-steps{margin:0;padding-inline-start:22px;line-height:1.9}.nl-proj b{white-space:normal}

/* ===== لوحة المعلم — ألوان مستوحاة من رؤية ٢٠٣٠ ===== */
body.dash-mode{--v-green:#006C35;--v-teal:#00A19B;--v-mint:#7BC8A4;--v-navy:#14303f;--v-sand:#C9A961;background:linear-gradient(180deg,#eef6f2 0,#f6f8f7 340px)}
body.dash-mode #app{max-width:1120px}
.dash{display:flex;flex-direction:column;gap:16px}
.dhero{position:relative;overflow:hidden;border-radius:26px;padding:22px 24px 18px;color:#fff;background:radial-gradient(600px 300px at 0% 0%,rgba(123,200,164,.35),transparent 60%),linear-gradient(135deg,var(--v-green) 0%,#0b7a52 45%,var(--v-teal) 100%);box-shadow:0 22px 50px -24px rgba(0,108,53,.7)}
.dhero::after{content:"";position:absolute;inset:auto -60px -90px auto;width:260px;height:260px;border-radius:50%;border:38px solid rgba(255,255,255,.07)}
.dh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative;z-index:1}

.dh-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dh-date{font-size:13px;opacity:.9;margin-inline-end:6px}
.dh-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}.dh-btn:hover{background:rgba(255,255,255,.26)}
.dk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;position:relative;z-index:1}
.dk{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);color:var(--v-navy);border:0;border-radius:18px;padding:12px 14px;font:inherit;text-align:start;cursor:pointer;box-shadow:0 10px 24px -14px rgba(0,0,0,.4);transition:transform .15s}.dk:hover{transform:translateY(-2px)}
.dk-ic{width:42px;height:42px;border-radius:12px;background:#e6f4ec;display:grid;place-items:center;font-size:20px;flex:none}.dk-t b{display:block;font-size:24px;line-height:1.1;color:var(--v-green)}.dk-t small{color:#5b6b66;font-weight:700}
.dh-warn{margin:14px 0 0;font-size:12.5px;opacity:.85;position:relative;z-index:1}
.dnav{position:sticky;top:8px;z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #dfe9e4;border-radius:18px;padding:6px;box-shadow:0 10px 24px -18px rgba(0,60,30,.45)}
.dnav::-webkit-scrollbar{display:none}

.dnav button:hover{background:#eef6f2}.dnav button.on{background:linear-gradient(135deg,var(--v-green),var(--v-teal));color:#fff;box-shadow:0 8px 18px -10px var(--v-green)}
.dmain{display:flex;flex-direction:column;gap:16px}.dpanel{animation:dfade .25s ease}@keyframes dfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.dash-mode .card{border-radius:22px;border-color:#e2ece7}

.pn-h{display:flex;justify-content:space-between;align-items:center}.pn-h h2{margin:0;font-size:21px}
.pn-hint{margin:0;background:#eef6f2;border-radius:12px;padding:8px 12px;font-size:14px;color:#2d4a3e}.lnk{background:none;border:0;color:var(--v-green);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0}

.dq-ic{font-size:26px;width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#e6f4ec,#e2f5f4);display:grid;place-items:center;margin-bottom:4px}.dq b{font-size:16.5px}.dq small{color:#5b6b66;line-height:1.6}
.dash-tip{background:linear-gradient(135deg,#fbf6ea,#fff)!important;border-color:#eadcb8!important}.dash-tip p{margin:4px 0 0;color:#5b4a22}

.topbar .tb-l a{display:inline-flex;align-items:center;gap:7px;color:#e6eef6;text-decoration:none;font-weight:500}
.topbar .tb-l a:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
.tb-i{display:inline-flex;width:15px;height:15px;opacity:.85}.tb-i svg{width:100%;height:100%}
@media (max-width:760px){.topbar{display:none}}
.sitehead{background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);box-shadow:none;border-bottom:1px solid var(--line);transition:box-shadow .2s}
.sitehead.scrolled{box-shadow:0 6px 24px -12px rgba(15,39,64,.25)}
.sitehead .wrap{min-height:78px;gap:28px}
.brand img{height:46px;border-radius:10px;padding:0;background:none}
.brand b{font-size:18.5px;letter-spacing:0}.brand small{font-size:12.5px}
.mainnav{gap:4px;margin-inline-start:0;justify-content:center}
.mainnav>a,.mainnav .dd>button{position:relative;padding:10px 12px;border-radius:8px;font-size:15px;font-weight:500;color:color-mix(in srgb,var(--ink) 82%,transparent)}
.mainnav>a:hover,.mainnav .dd>button:hover{background:none;color:var(--brand1)}
.mainnav a.on,.mainnav .dd.on>button{background:none;color:var(--brand1);font-weight:700}
.mainnav>a.on::after,.mainnav .dd.on>button::after{content:"";position:absolute;inset-inline:12px;bottom:-19px;height:3px;border-radius:3px 3px 0 0;background:var(--brand1)}
.mainnav .nav-ext{color:var(--muted)}
.hd-acts{display:flex;align-items:center;gap:10px;flex:none}
.hd-cta{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 18px;border-radius:10px;background:var(--brand1);color:#fff;font-weight:700;font-size:14.5px;text-decoration:none;white-space:nowrap;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--brand1) 80%,transparent);transition:filter .15s,transform .15s}
.hd-cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.hd-cta.on{outline:2px solid color-mix(in srgb,var(--brand1) 35%,transparent);outline-offset:2px}
.hd-cta-i{display:flex;width:19px;height:19px}.hd-cta-i svg{width:100%;height:100%}
.sitehead .burger{width:44px;height:44px;border-radius:10px;margin-inline-start:0}
@media (max-width:1380px){.mainnav>a,.mainnav .dd>button{padding:10px 9px;font-size:14.5px}.sitehead .wrap{gap:18px}}
@media (max-width:1220px){.hd-acts{margin-inline-start:auto}.mainnav{display:none}}
@media (max-width:640px){.sitehead .wrap{min-height:64px;gap:10px}.hd-cta{height:42px;padding:0 12px;font-size:13.5px}.brand img{height:40px}}
@media (max-width:400px){.hd-cta-t{display:none}.hd-cta{width:42px;padding:0;justify-content:center}}
@media print{.topbar,.hd-acts{display:none!important}}

/* زر الرسالة في الشريط العلوي والتذييل */
.tb-btn{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:#e6eef6;font:inherit;font-size:13px;font-weight:500;cursor:pointer;padding:0}
.tb-btn:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
.f-btn{background:none;border:0;font:inherit;cursor:pointer;padding:0}
/* الزر العائم */
.msg-fab{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 18px 0 16px;border-radius:26px;border:0;background:var(--grad);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 24px rgba(20,60,100,.3);transition:transform .15s}
.msg-fab svg{width:24px;height:24px}.msg-fab:hover{transform:translateY(-2px)}
.fabs{align-items:flex-start}
.fabs .mail-fab{width:48px;height:48px;background:var(--surface);color:var(--brand1);border:1px solid var(--line)}
.fabs .mail-fab svg{width:22px;height:22px}
@media (max-width:640px){.msg-fab{height:48px;padding:0 14px}.msg-fab-t{display:none}.msg-fab{width:48px;padding:0;justify-content:center}.fabs .mail-fab{width:44px;height:44px}}
/* نافذة الرسالة */
.ct-ov{position:fixed;inset:0;z-index:300;background:rgba(10,25,40,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.ct-card{width:min(480px,100%);background:var(--surface);color:var(--ink);border-radius:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);overflow:hidden}
.ct-head{display:flex;align-items:center;gap:12px;padding:18px 20px;background:var(--grad);color:#fff}
.ct-head h2{margin:0;font-size:19px}.ct-head small{opacity:.9}
.ct-ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}.ct-ic svg{width:24px;height:24px}
.ct-x{margin-inline-start:auto;background:rgba(255,255,255,.15);border:0;color:#fff;width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
.ct-form{display:flex;flex-direction:column;gap:6px;padding:18px 20px 20px}
.ct-form label{font-weight:700;font-size:14px;margin-top:6px}
.ct-form input,.ct-form textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 13px;font:inherit;font-size:15.5px;color:var(--ink)}
.ct-form input:focus,.ct-form textarea:focus{outline:none;border-color:var(--brand1);background:var(--surface)}
.ct-form #ct-phone{text-align:right}
.ct-form textarea{resize:vertical;min-height:110px}
.ct-cnt{align-self:flex-end;color:var(--muted);font-size:12px}
.ct-hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
.ct-note{min-height:1.4em;margin:2px 0;font-weight:700;font-size:14px}.ct-note.bad{color:var(--bad)}
.ct-send{width:100%;justify-content:center;height:48px;font-size:16px}
.ct-priv{margin:4px 0 0;text-align:center;color:var(--muted);font-size:12.5px}
.ct-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 0 4px}
.ct-done b{font-size:19px}.ct-done p{margin:0 0 8px;color:var(--muted)}
.ct-ok{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:28px;font-weight:700}
@media print{.ct-ov,.msg-fab{display:none!important}}
/* الشعار التعليمي الجديد */
.site-mark,.brand img.site-mark{background:none!important;box-shadow:none!important;border-radius:0!important;object-fit:contain;height:50px!important;width:50px!important}
.av-logo{background:#fff;object-fit:contain;padding:8px;box-sizing:border-box;border:1px solid var(--line)}
.foot-logo{width:170px;border-radius:0}
@media (max-width:640px){.site-mark,.brand img.site-mark{height:42px!important;width:42px!important}}

/* سياسة الخصوصية */
.pv-doc{background:var(--surface);border-radius:22px;padding:30px 32px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px;line-height:1.85;max-width:860px}
.pv-sum{background:color-mix(in srgb,var(--brand2) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--brand2) 30%,var(--line));border-radius:16px;padding:16px 20px}
.pv-sum b{font-size:17px}.pv-sum ul{margin:8px 0 0}
.pv-sec h2{font-size:20px;margin:0 0 8px;color:var(--ink)}
.pv-sec h3{font-size:16px;margin:14px 0 4px;color:var(--brand1)}
.pv-sec p{margin:0 0 6px}.pv-doc ul{margin:4px 0;padding-inline-start:22px}.pv-doc li{margin:4px 0}
.pv-acts{gap:10px;flex-wrap:wrap;margin-top:8px}
.pv-upd{color:var(--muted);font-size:13.5px;margin:0;border-top:1px solid var(--line);padding-top:12px}
.f-links{display:inline-flex;gap:0;align-items:center;flex-wrap:wrap}.f-links a{color:inherit;text-decoration:underline;text-underline-offset:3px}.f-links .sep{margin-inline:8px;opacity:.6}
.ct-priv a{color:var(--brand1)}
@media (max-width:640px){.pv-doc{padding:20px 18px}}

/* الموافقة */
.p-agree,.ct-agree{display:flex;gap:10px;align-items:flex-start;text-align:start;font-size:13.5px;line-height:1.7;color:var(--muted);max-width:380px;margin:4px auto;cursor:pointer}
.ct-agree{max-width:none;margin:6px 0 0}
.p-agree input,.ct-agree input{width:18px;height:18px;flex:none;margin-top:3px;accent-color:var(--brand1)}
.p-agree a,.ct-agree a{color:var(--brand1)}
.p-agree.need{color:var(--bad);font-weight:700}.p-agree.need input{outline:2px solid var(--bad);outline-offset:2px}
.rep-login .note a{color:var(--brand1)}
/* ===== إضافات: الأخبار، ابدأ من هنا، الاختبارات، الدليل، ركن الذكاء ===== */
.news{background:linear-gradient(135deg,#fff7e6,#fffdf7);border:1.5px solid #f3d38a;border-radius:18px;padding:14px 18px}
.news-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.news-h b{font-size:17px;color:#7a4b00}.news-ic{font-size:20px}
.news ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}.news li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;line-height:1.7}
.news a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}.news small{color:var(--muted)}
.news-g{background:#7a4b00;color:#fff;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .news{background:#2a2414;border-color:#5c4a1c}:root:not([data-theme="light"]) .news-h b{color:#f3c96b}}
.start-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.start-card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:1.5px solid transparent;transition:border-color .15s,transform .15s}
.start-card:hover{border-color:var(--brand1);transform:translateY(-2px)}
.start-emo{font-size:34px;line-height:1}.start-card b{font-size:18.5px}.start-card p{margin:0;color:var(--muted);line-height:1.7;flex:1}.start-go{color:var(--brand1);font-weight:700;font-size:14.5px}
@media (max-width:860px){.start-grid{grid-template-columns:1fr}}
.ai-promo{background:linear-gradient(135deg,#3b3f9e,#5b5fc7 55%,#1d6fb8)!important}
.u-prog{display:flex;align-items:center;gap:12px;margin:-4px 0 12px;flex-wrap:wrap}.u-bar{flex:1;min-width:140px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.u-bar span{display:block;height:100%;background:var(--grad);border-radius:99px}.u-prog small{color:var(--muted);font-weight:600}
/* الاختبار */
.qz{display:flex;flex-direction:column;gap:18px}.qz-q{display:flex;flex-direction:column;gap:10px}.qz-q>b{font-size:16.5px;line-height:1.7}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

اذا يحتاج الروبوت ليتحرك في متاهة؟|برنامجًا بأوامر مرتبة|خلفية ملونة|كلمة مرور|طابعة|الروبوت ينفذ ما نبرمجه عليه.","كيف يتعلم نموذج الذكاء الاصطناعي التمييز بين القطط والكلاب؟|برؤية صور كثيرة لكل منهما|بالتخمين|بقراءة قصة|لا يمكنه|الأمثلة الكثيرة هي ما يتعلم منه النموذج."]}}),Object.assign(EXL,{"g4-t1-u1-1":{s:"الحاسب مثل الطالب: يسمع منك (الإدخال)، ويفكّر (المعالجة)، ثم يجيبك (الإخراج).",m:["الخلط بين الفأرة والشاشة: الفأرة تُدخل الأوامر، والشاشة تعرض النتائج.","الظن أن الميكروفون جهاز إخراج، وهو جهاز إدخال لأنه ينقل صوتك إلى الحاسب."]},"g4-t1-u1-2":{s:"سطح المكتب مثل طاولتك: عليها أدواتك (الأيقونات)، وفي أسفلها درج فيه ما تستخدمه الآن (شريط المهام).",m:["حذف أيقونة برنامج من سطح المكتب يحذف الاختصار فقط، لا البرنامج نفسه.","نسيان أن الملف المحذوف يبقى في سلة المحذوفات ويمكن استعادته."]},"g4-t1-u1-3":{s:"الإعدادات مثل أزرار التحكم في غرفتك: تغيّر بها الإضاءة والألوان كما تحب.",m:["تغيير إعدادات كثيرة دون معرفة ما تفعله؛ غيّر إعدادًا واحدًا وتأكد من نتيجته.","الخلط بين الخلفية (الصورة خلف الأيقونات) والسطوع (إضاءة الشاشة)."]},"g4-t1-u1-p":{s:"قبل أن تطفئ الحاسب، احفظ عملك وأغلق البرامج، تمامًا كما ترتّب أغراضك قبل النوم.",m:["إطفاء الحاسب بسحب السلك، وهذا قد يتلف الملفات.","إطفاؤه قبل حفظ العمل فيضيع ما كتبته."]},"g4-t1-u2-1":{s:"المؤشر مثل رأس القلم: أينما وضعته كتبتَ.",m:["استخدام المسافة لبدء سطر جديد بدل مفتاح Enter.","الخلط بين Backspace (يحذف ما قبل المؤشر) وDelete (يحذف ما بعده)."]},"g4-t1-u2-2":{s:"النسخ مثل التصوير: يبقى الأصل وتأخذ صورة منه. والقص مثل النقل: يخرج من مكانه إلى مكان جديد.",m:["استخدام القص بدل النسخ فيختفي النص من مكانه الأصلي.","نسيان وضع المؤشر في المكان الصحيح قبل اللصق."]},"g4-t1-u2-3":{s:"التنسيق مثل تلوين الدفتر: يبقى الكلام نفسه لكن شكله يصبح أجمل وأوضح.",m:["محاولة التنسيق قبل تحديد النص، فلا يحدث شيء.","الإكثار من الألوان والخطوط حتى يصعب القراءة."]},"g4-t1-u2-4":{s:"المحاذاة تحدد أين «يقف» النص في السطر: يمينًا أو وسطًا أو يسارًا.",m:["توسيط العنوان بالضغط على المسافة مرات كثيرة بدل زر التوسيط.","نسيان أن النص العربي يُحاذى لليمين عادة."]},"g4-t1-u2-p":{s:"بطاقتك ثلاث فقرات قصيرة: من أنت، وماذا تحب، وما حلمك، بعنوان واضح في الوسط.",m:["كتابة البطاقة في سطر واحد طويل بدل أسطر منفصلة.","نسيان حفظ الملف باسم واضح."]},"g4-t1-u3-1":{s:"المتصفح مثل باب، والموقع مثل غرفة، والرابط مثل ممر يأخذك من غرفة إلى أخرى.",m:["الخلط بين المتصفح (البرنامج) والموقع (ما نفتحه داخله).","كتابة عنوان الموقع في مربع البحث بأخطاء إملائية."]},"g4-t1-u3-2":{s:"محرك البحث مثل أمين المكتبة: كلما كان سؤالك محددًا، أعطاك الكتاب المناسب أسرع.",m:["كتابة جملة طويلة جدًا بدل كلمات مفتاحية قصيرة.","أخذ أول نتيجة دون قراءة النتائج الأخرى."]},"g4-t1-u3-3":{s:"المصدر الموثوق مثل معلمك: تعرف من هو، وتثق بما يقوله لأنه صحيح.",m:["تصديق أي معلومة لمجرد أنها على الإنترنت.","عدم التحقق من المعلومة في مصدر ثانٍ."]},"g4-t1-u3-4":{s:"معلوماتك الشخصية مثل مفتاح بيتك: لا تعطه لأي غريب.",m:["استخدام كلمة مرور سهلة مثل 123456.","مشاركة الاسم الكامل أو المدرسة أو الصور مع غرباء في الألعاب."]},"g4-t1-u3-p":{s:"ابحث بكلمات قصيرة، واختر موقعًا موثوقًا، ولا تشارك أي معلومة عنك.",m:["نسخ المعلومة دون ذكر مصدرها.","النقر على إعلانات أو روابط غريبة أثناء البحث."]},"g4-t1-u4-1":{s:"سكراتش مثل لعبة مكعبات: كل مكعب أمر، وعندما تركّبها معًا تصنع برنامجًا.",m:["وضع اللبنات متفرقة دون أن تتصل ببعضها، فلا تُنفّذ.","نسيان لبنة البداية «عند نقر العلم الأخضر»."]},"g4-t1-u4-2":{s:"الخوارزمية مثل وصفة الطبخ: خطوات بالترتيب، ولو قدّمت خطوة على أخرى تغيّرت النتيجة.",m:["ترتيب اللبنات بشكل خاطئ فيتحرك الكائن قبل أن يستدير.","كتابة عدد خطوات كبير جدًا فيخرج الكائن من المنصة."]},"g4-t1-u4-3":{s:"التكرار مثل قول «اقفز ٥ مرات» بدل أن تقول «اقفز» خمس مرات.",m:["تكرار اللبنات يدويًا بدل استخدام لبنة «كرر».","وضع أوامر داخل التكرار لا نريد تكرارها."]},"g4-t1-u4-4":{s:"أنزل القلم = ضع القلم على الورقة، وارفع القلم = ارفعه عنها.",m:["نسيان «أنزل القلم» قبل الحركة فلا يُرسم شيء.","استخدام زاوية خاطئة في الاستدارة فلا يكتمل الشكل."]},"g4-t1-u4-p":{s:"خطط لرسمتك أولًا: كم ضلعًا؟ وكم درجة يستدير الكائن؟ ثم استخدم التكرار.",m:["البدء بالبرمجة قبل التخطيط للشكل.","نسيان «امسح الكل» في بداية البرنامج فتتراكم الرسومات."]},"g4-t2-u1-1":{s:"العرض التقديمي مثل كتاب صور قصير: كل شريحة صفحة فيها فكرة واحدة.",m:["كتابة فقرات طويلة في الشريحة.","وضع أكثر من فكرة في شريحة واحدة."]},"g4-t2-u1-2":{s:"الصورة الجيدة تشرح الفكرة بدل كلام كثير.",m:["تكبير الصورة من طرف واحد فيتشوه شكلها؛ اسحب من الزاوية.","استخدام صور غير واضحة أو لا علاقة لها بالموضوع."]},"g4-t2-u1-3":{s:"الانتقال بين الشرائح، والحركة داخل الشريحة.",m:["الإكثار من الحركات حتى يتشتت الجمهور.","الخلط بين الانتقال (بين الشرائح) والحركة (لعنصر واحد)."]},"g4-t2-u1-4":{s:"الفيديو القصير المناسب يجعل العرض حيًّا، ويُشغَّل بالنقر عليه أثناء العرض.",m:["إدراج فيديو طويل جدًا لا يناسب وقت العرض.","نسيان تجربة الفيديو قبل العرض."]},"g4-t2-u1-p":{s:"شريحة عنوان، ثم شرائح لمعالم المدينة بصورة وجملة، ثم شريحة ختام.",m:["نسيان شريحة العنوان.","استخدام انتقالات مختلفة في كل شريحة."]},"g4-t2-u2-1":{s:"جدول البيانات مثل لعبة «فين الكنز»: الحرف يحدد العمود والرقم يحدد الصف.",m:["كتابة اسم الخلية بالعكس (4C بدل C4).","الخلط بين الصف (أفقي) والعمود (رأسي)."]},"g4-t2-u2-2":{s:"المعادلة تبدأ دائمًا بـ = لتقول للحاسب: «احسب هذا».",m:["نسيان علامة = فيظهر النص كما هو ولا يُحسب.","كتابة الأرقام في المعادلة بدل أسماء الخلايا، فلا يتحدث الناتج عند تغييرها."]},"g4-t2-u2-p":{s:"اكتب الأيام في عمود والمصروف في عمود، ثم اجمعها بـ SUM.",m:["تحديد نطاق ناقص في دالة SUM.","كتابة رمز العملة داخل الخلية مع الرقم فلا تُحسب."]},"g4-t2-u3-1":{s:"التسجيل الصوتي: اضغط تسجيل، وتكلم بوضوح قريبًا من الميكروفون، ثم أوقف واحفظ.",m:["التسجيل في مكان فيه ضوضاء.","نسيان حفظ التسجيل بعد الإيقاف."]},"g4-t2-u3-2":{s:"تطبيق الصور مثل ألبوم العائلة على الحاسب.",m:["البحث عن الصور في مكان غير المكان الذي حُفظت فيه.","حذف صورة ظنًا أنها نسخة مكررة."]},"g4-t2-u3-3":{s:"التحسين مثل تنظيف النظارة: الصورة نفسها لكن أوضح.",m:["القص الزائد حتى يضيع جزء مهم من الصورة.","رفع السطوع كثيرًا فتصبح الصورة بيضاء."]},"g4-t2-u3-4":{s:"المرشّح يلبس الصورة لونًا جديدًا بنقرة واحدة.",m:["تطبيق عدة مرشحات فوق بعض حتى تتشوه الصورة.","الحفظ فوق الصورة الأصلية بدل حفظ نسخة جديدة."]},"g4-t2-u3-p":{s:"افتح الصورة، قصّها، اضبط إضاءتها، أضف مرشحًا خفيفًا، ثم احفظ نسخة جديدة.",m:["نسيان حفظ النسخة المحسّنة.","اختيار صورة غير واضحة من البداية."]},"g4-t2-u4-1":{s:"الروبوت مثل جسم الإنسان: المستشعرات حواسه، ووحدة التحكم عقله، والمحركات عضلاته.",m:["الظن أن الروبوت يفكر وحده دون برمجة.","الخلط بين المستشعر (يجمع المعلومات) ووحدة التحكم (تقرر)."]},"g4-t2-u4-2":{s:"لينعطف الروبوت، تدور عجلة أسرع من الأخرى، مثل السيارة عند الدوران.",m:["اختيار اتجاه الانعطاف بالعكس.","نسيان أن زاوية الانعطاف تحدد مقدار الدوران."]},"g4-t2-u4-x":{s:"الذكاء الاصطناعي يتعلم من أمثلة كثيرة، مثلما تتعلم أنت التمييز بين الحيوانات من رؤيتها مرات كثيرة.",m:["الظن أن الذكاء الاصطناعي لا يخطئ أبدًا.","الظن أنه يعرف كل شيء دون أن يتعلم من بيانات."]},"g4-t2-u4-p":{s:"خطط للمسار على الورق أولًا: كم يتقدم الروبوت؟ ومتى ينعطف؟ ثم برمجه.",m:["البرمجة دون تخطيط للمسار.","تجربة البرنامج كاملًا مرة واحدة بدل تجربته خطوة خطوة."]}}),Object.assign(EXU,{"g5-t1-u1":{home:"اطلب من ابنك أن ينظّم صور جواله أو ملفات الحاسب في مجلدات بأسماء واضحة (رحلات، مدرسة، عائلة)، وأن يشرح لك امتداد كل ملف.",q:["أيّ جهاز يُطوى ويعمل ببطارية؟|الحاسب المحمول|الحاسب المكتبي|الطابعة|الماسح الضوئي|المحمول يسهل نقله ويعمل ببطارية.","ما عقل الحاسب الذي ينفّذ الأوامر؟|المعالج|الشاشة|الفأرة|السماعات|المعالج ينفّذ العمليات والأوامر.","ما الجزء الذي يحفظ الملفات والبرامج؟|وحدة التخزين|المعالج|لوحة المفاتيح|الكاميرا|وحدة التخزين مثل خزانة الحاسب.","ما الماسح الضوئي؟|جهاز إدخال ينقل صور الأوراق إلى الحاسب|جهاز إخراج للصوت|نوع من الشاشات|برنامج رسم|الماسح الضوئي يحوّل الورقة إلى صورة على الحاسب.","ما الامتداد في اسم الملف «رحلة.jpg»؟|jpg|رحلة|النقطة|الاسم كاملًا|الامتداد الحروف بعد النقطة ويدل على نوع الملف.","ما المجلد؟|حاوية ننظّم فيها الملفات|ملف صوتي|برنامج تصميم|جهاز تخزين خارجي|المجلد مثل الدرج الذي نضع فيه الأوراق.","أيّ اسم أفضل لملف واجب العلوم؟|واجب_العلوم_الوحدة1|ملف جديد|aaa|بدون اسم|الاسم الواضح يسهّل إيجاد الملف لاحقًا.","ما الجهاز الذي بشاشة لمس دون لوحة مفاتيح منفصلة؟|الجهاز اللوحي|الحاسب المكتبي|الطابعة|الخادم|الجهاز اللوحي يُستخدم باللمس."]},"g5-t1-u2":{home:"اطلب من ابنك أن يكتب صفحة عن هواية يحبها: عنوان منسّق، وصورة يلتف حولها النص، ورسم SmartArt لخطوات الهواية، ثم يعاين الطباعة قبل الطباعة.",q:["ما التفاف النص؟|طريقة ترتيب النص حول الصورة|تكبير الخط|حذف الصورة|طباعة الصفحة|التفاف النص يحدد كيف يحيط النص بالصورة.","ما SmartArt؟|رسومات توضيحية جاهزة لعرض المعلومات|نوع خط|جدول بيانات|برنامج صوت|SmartArt يحوّل النقاط إلى رسم واضح.","أيّ رسم يناسب مراحل تتكرر مثل دورة الماء؟|رسم الدورة|رسم القائمة|صورة عادية|جدول|رسم الدورة يعرض مراحل متكررة.","ما فائدة التدقيق الإملائي؟|البحث عن الأخطاء الإملائية وتصحيحها|تغيير لون الخط|إدراج الصور|حفظ الملف|الخط الأحمر تحت الكلمة يدل على خطأ محتمل.","لماذا نستخدم معاينة الطباعة؟|لرؤية شكل الصفحة قبل طباعتها|لحذف الصفحة|لكتابة نص جديد|لتغيير الخلفية|المعاينة توفر الورق والحبر.","متى يظهر تبويب «تنسيق الصورة»؟|عند تحديد الصورة|عند فتح البرنامج|عند الطباعة|لا يظهر أبدًا|التبويب يظهر عند تحديد الصورة فقط.","التنسيق يغيّر…|شكل النص دون معناه|معنى النص|عدد الكلمات فقط|اسم الملف|التنسيق شكل، والمحتوى هو المعنى.","هل نعتمد على التدقيق الإملائي وحده؟|لا، نقرأ النص بأنفسنا أيضًا|نعم دائمًا|لا نحتاجه|فقط في الإنجليزية|المدقق قد لا يكتشف كل الأخطاء."]},"g5-t1-u3":{home:"صوّرا مقطعًا قصيرًا (٣٠ ثانية) عن مكان تحبونه في البيت، ودع ابنك يرتّب المقاطع على الشريط الزمني ويضيف انتقالًا وموسيقى بصوت منخفض.",q:["ما التلاشي في الصوت؟|انخفاض الصوت تدريجيًا|ارتفاع الصوت فجأة|حذف الصوت|تكرار الصوت|التلاشي يجعل النهاية ناعمة.","ما التصدير؟|حفظ العمل في ملف بصيغة معينة|حذف المشروع|فتح ملف جديد|طباعة الفيديو|التصدير يُخرج العمل جاهزًا للمشاركة.","ما صيغة الصوت صغيرة الحجم؟|MP3|DOCX|XLSX|PPTX|MP3 صيغة صوت شائعة وصغيرة.","ما الشريط الزمني؟|المكان الذي نرتّب فيه المقاطع بالتسلسل|قائمة الملفات|شريط المهام|شريط العنوان|الشريط الزمني يحدد ترتيب المقاطع ومدتها.","ما الانتقال في الفيديو؟|تأثير بين مقطع وآخر|عنوان الفيديو|الصوت فقط|اسم الملف|الانتقال يجعل التنقل بين المقاطع سلسًا.","هل يجوز استخدام أي موسيقى أو صورة من الإنترنت في الفيديو؟|لا، نستخدم ما يُسمح باستخدامه ونذكر مصدره|نعم دائمًا|نعم إذا كانت جميلة|فقط إذا كانت قصيرة|حقوق الآخرين يجب احترامها.","ما جهاز الالتقاط؟|جهاز نسجّل به الصوت أو الصورة مثل الميكروفون والكاميرا|الطابعة|الشاشة|لوحة المفاتيح|أجهزة الالتقاط تُدخل الصوت والصورة.","ماذا نفعل قبل مشاركة الفيديو؟|نشاهده كاملًا ونتأكد منه|نحذفه|نغيّر امتداده عشوائيًا|لا شيء|المراجعة تكشف الأخطاء قبل المشاركة."]},"g5-t1-u4":{home:"العبا لعبة «إذا… وإلا»: إذا كان الجو حارًا نشرب ماءً باردًا، وإلا نشرب شايًا. اطلب من ابنك أن يخترع ٣ قواعد مثلها، ثم يبرمج واحدة في سكراتش.",q:["ما الخطوة التي نتأكد فيها أن البرنامج يعمل؟|الاختبار|الحذف|الطباعة|التصدير|نشغّل البرنامج ونجربه لنعرف هل يعمل.","ما تصحيح الأخطاء؟|إيجاد الخطأ في البرنامج وإصلاحه|حذف البرنامج|تغيير الخلفية|إضافة كائن|المبرمج يجرّب ويصحح حتى يعمل البرنامج.","ما الشرط في البرمجة؟|سؤال جوابه صح أو خطأ|لون الكائن|نوع الخلفية|صوت|البرنامج يختار ما يفعله حسب الشرط.","متى نستخدم «إذا… وإلا»؟|عندما نختار بين أمرين حسب الشرط|عندما نكرر أمرًا|لتغيير الخلفية فقط|لا نستخدمها|إذا تحقق الشرط ننفذ الأول، وإلا الثاني.","ما الإحداثي x؟|الإحداثي الأفقي|الإحداثي الرأسي|لون الكائن|حجم الكائن|x يحدد الموضع يمينًا ويسارًا.","ما فائدة البث في سكراتش؟|إرسال رسالة إلى الكائنات لتبدأ أوامر معينة|حذف الكائن|تكبير المنصة|حفظ المشروع|البث يجعل الكائنات تتواصل.","أين تُحفظ إجابة المستخدم بعد لبنة «اسأل»؟|في «الإجابة»|في الخلفية|في المظهر|لا تُحفظ|لبنة الإجابة تحمل ما كتبه المستخدم.","ما المظهر في سكراتش؟|شكل من أشكال الكائن|الخلفية|صوت الكائن|اسم المشروع|تبديل المظاهر يصنع الحركة."]},"g5-t2-u1":{home:"أرسل لابنك بريدًا إلكترونيًا فيه سؤال بسيط ومرفق صورة، واطلب منه أن يرد عليك برسالة مهذبة فيها تحية وموضوع واضح وتوقيع.",q:["ما الإنترنت؟|شبكة عالمية تربط الأجهزة|موقع واحد|برنامج رسم|جهاز تخزين|الإنترنت يربط ملايين الأجهزة حول العالم.","ما الويب؟|مجموعة الصفحات والمواقع المرتبطة بروابط|سلك الإنترنت|البريد الإلكتروني فقط|نوع حاسب|الويب جزء من الإنترنت.","ما المرفق في البريد الإلكتروني؟|ملف يُرسل مع الرسالة|عنوان المرسل|موضوع الرسالة|كلمة المرور|نرفق الصور والملفات بالرسالة.","ما وظيفة الرمز @ في عنوان البريد؟|يفصل اسم المستخدم عن اسم الموقع|يدل على الصور|يعني «سري»|لا فائدة منه|مثال: name@example.com.","ما التخزين السحابي؟|حفظ الملفات على الإنترنت|حفظها في الطابعة|حذف الملفات|نسخها على ورق|نصل إلى ملفاتنا من أي جهاز.","ما الصلاحية في مشاركة الملفات؟|ما يستطيع الشخص فعله بالملف، كالعرض أو التعديل|اسم الملف|حجم الملف|لون الملف|نحدد هل يعرض الشخص الملف فقط أم يعدّله.","ماذا تفعل برسالة من مرسل مجهول فيها رابط غريب؟|لا أفتح الرابط وأخبر والديّ|أفتحه فورًا|أرسله لأصدقائي|أرد بمعلوماتي|الروابط الغريبة قد تكون خطيرة.","ما أفضل موضوع لرسالة إلى المعلم؟|سؤال عن واجب الوحدة الثانية|مرحبا|بدون موضوع|؟؟؟|الموضوع الواضح يبيّن سبب الرسالة."]},"g5-t2-u2":{home:"خطّطا معًا لميزانية نزهة عائلية في جدول: الطعام، والمواصلات، والتذاكر. ودع ابنك يحسب التكلفة الإجمالية بالمعادلات.",q:["ما مربع الاسم؟|خانة تعرض اسم الخلية المحددة|مكان كتابة النص|اسم الملف|شريط المهام|مربع الاسم يبيّن الخلية التي تقف عليها.","ما رمز الضرب في جدول البيانات؟|*|x|×|#|نستخدم النجمة للضرب.","ما مرجع الخلية؟|اسم الخلية الذي نستخدمه في المعادلة|لونها|حجمها|الملاحظة المكتوبة فيها|مثل =B2*C2.","لماذا نكتب =B2*C2 بدل =5*3؟|لأن الناتج يتحدث تلقائيًا إذا تغيّرت الأرقام|لأنها أقصر|لا فرق|لأنها ملونة|مراجع الخلايا تجعل الجدول ذكيًا.","ما ورقة العمل؟|الجدول الذي نعمل فيه|الطابعة|ملف صوتي|صفحة ويب|المصنف قد يحتوي عدة أوراق عمل.","ما ناتج =10/2؟|5|12|8|20|الشرطة المائلة تعني القسمة.","إذا كتبنا 5+3 بدون =، ماذا يظهر؟|يظهر النص 5+3 كما هو|8|خطأ|لا شيء|المعادلة لا تُحسب بدون علامة =.","كيف نوسّع عمودًا ضيقًا؟|نسحب حد العمود في رأسه|نحذف العمود|نغيّر الخط|نعيد تشغيل البرنامج|سحب الحد يغيّر عرض العمود."]},"g5-t2-u3":{home:"تحدثا عن موقف تنمّر إلكتروني (قصة افتراضية): ماذا يفعل ابنك إذا رأى إساءة لزميله؟ واتفقا على: لا يرد بإساءة، يحتفظ بالدليل، ويخبر الكبار.",q:["ما التنمر الإلكتروني؟|الإساءة إلى شخص عبر الإنترنت|لعبة جماعية|نوع من البريد|برنامج حماية|التنمر الإلكتروني سلوك مرفوض ويجب الإبلاغ عنه.","ماذا تفعل إذا تعرّضت لتنمر إلكتروني؟|لا أرد بإساءة، وأحتفظ بالدليل، وأخبر والديّ|أرد بإساءة|أحذف حسابي فورًا دون إخبار أحد|أشارك الإساءة|الهدوء وإخبار الكبار هو التصرف الصحيح.","ما الحساب الخاص؟|حساب لا يرى محتواه إلا من تسمح لهم|حساب لكل الناس|حساب بلا كلمة مرور|حساب للشركات|الحساب الخاص يحمي خصوصيتك.","ما المدوّنة؟|موقع لنشر المقالات القصيرة|جدول بيانات|برنامج صوت|لعبة|المدونة مكان لنشر الأفكار بانتظام.","ما التدوينة؟|مقالة واحدة في المدونة|المدونة كلها|تعليق قصير|صورة فقط|المدونة تتكون من تدوينات.","ما الملكية الفكرية؟|حق صاحب العمل في عمله|ملكية الحاسب|كلمة المرور|اسم الموقع|احترام أعمال الآخرين ونسبتها لأصحابها.","ما القرصنة؟|نسخ البرامج أو الأعمال دون إذن|كتابة مقال|حفظ ملف|نشر صورة لك|القرصنة اعتداء على حقوق الآخرين.","إذا استخدمت معلومة من موقع في تدوينتك، ماذا تفعل؟|أذكر المصدر|أنسبها لنفسي|لا أذكر شيئًا|أغيّر كلمة واحدة فقط|ذكر المصدر من الأمانة العلمية."]},"g5-t2-u4":{home:"ابحثا عن ٣ روبوتات أو آلات ذكية في حياتكم اليومية (المكنسة الذكية، الصراف الآلي، المساعد الصوتي)، وتحدثا: ما المهمة التي تؤديها؟ وهل فيها ذكاء اصطناعي؟",q:["ما الروبوت؟|آلة مبرمجة تنفّذ المهام|إنسان آلي يفكر وحده دائمًا|لعبة فقط|نوع حاسب مكتبي|الروبوت ينفذ ما بُرمج عليه.","أين تُستخدم الذراع الآلية غالبًا؟|في المصانع|في المطبخ فقط|في الحدائق|في المدارس فقط|تؤدي مهام دقيقة ومتكررة في المصانع.","ما حلقة التكرار؟|أوامر تُعاد عددًا من المرات|أمر واحد|حذف البرنامج|مستشعر|التكرار يختصر البرنامج.","كم درجة الزاوية القائمة؟|٩٠ درجة|٤٥ درجة|١٨٠ درجة|٣٦٠ درجة|الزاوية القائمة مثل ركن الورقة.","لرسم مربع بالروبوت، كم مرة نكرر «تقدّم ثم استدر ٩٠»؟|٤|٢|٣|٨|المربع ٤ أضلاع متساوية.","ما الذكاء الاصطناعي؟|قدرة الحاسب على التعلم واتخاذ القرار|روبوت فقط|إنترنت سريع|لعبة فيديو|الذكاء الاصطناعي يتعلم من البيانات.","أيّ مثال يستخدم الذكاء الاصطناعي؟|تطبيق ترجمة يفهم الجمل|مسطرة|آلة حاسبة بسيطة|مصباح|الترجمة الذكية من تطبيقات الذكاء الاصطناعي.","لماذا نستخدم الروبوت في المستودعات؟|لنقل البضائع بسرعة ودقة|للزينة|لأنه لا يحتاج كهرباء|لتشغيل الموسيقى|الروبوت يرفع الإنتاجية في المستودعات."]}}),Object.assign(EXL,{"g5-t1-u1-1":{s:"المكتبي ثابت مثل الثلاجة، والمحمول تحمله مثل الحقيبة، واللوحي تلمسه مثل الكتاب.",m:["الظن أن الجهاز اللوحي ليس حاسبًا، وهو حاسب صغير.","الخلط بين حجم الجهاز وقوته."]},"g5-t1-u1-2":{s:"المعالج عقل الحاسب، ووحدة التخزين ذاكرته طويلة المدى.",m:["الخلط بين المعالج ووحدة التخزين.","الظن أن الماسح الضوئي جهاز إخراج، وهو جهاز إدخال."]},"g5-t1-u1-3":{s:"المجلد مثل الدرج، والملف مثل الورقة، والامتداد مثل بطاقة تخبرك بنوع الورقة.",m:["تسمية الملفات بأسماء غير واضحة مثل «جديد».","حذف الامتداد أو تغييره فيتعذر فتح الملف."]},"g5-t1-u1-p":{s:"أنشئ مجلدًا لكل موضوع، وضع داخله ملفاته بأسماء واضحة.",m:["وضع كل الملفات في مكان واحد دون مجلدات.","إنشاء مجلدات كثيرة متداخلة بلا حاجة."]},"g5-t1-u2-1":{s:"التفاف النص يحدد هل تقف الصورة وسط الكلام أم يجري النص حولها.",m:["ترك الصورة في سطر وحدها فتترك فراغًا كبيرًا.","تكبير الصورة من الحافة فيتشوه شكلها."]},"g5-t1-u2-2":{s:"التنسيق يجعل المستند مرتبًا مثل دفتر نظيف: عناوين واضحة وفقرات متناسقة.",m:["استخدام خطوط وألوان كثيرة في صفحة واحدة.","تنسيق كل فقرة بطريقة مختلفة."]},"g5-t1-u2-3":{s:"SmartArt يحوّل النقاط إلى رسم يفهمه القارئ بنظرة.",m:["اختيار رسم لا يناسب المعلومة، مثل رسم دورة لخطوات غير متكررة.","كتابة نص طويل داخل أشكال SmartArt."]},"g5-t1-u2-4":{s:"دقّق ثم عاين ثم اطبع: ثلاث خطوات توفر الورق والوقت.",m:["الطباعة مباشرة دون معاينة.","قبول كل اقتراحات المدقق دون تفكير."]},"g5-t1-u2-p":{s:"عنوان، ومقدمة، وفقرات بصور، ورسم توضيحي، ثم تدقيق ومعاينة.",m:["نسخ النصوص من الإنترنت دون ذكر المصدر.","نسيان التدقيق الإملائي قبل التسليم."]},"g5-t1-u3-1":{s:"سجّل بوضوح، ثم قصّ الزائد، وأضف تلاشيًا في النهاية، ثم صدّر الملف.",m:["حفظ المشروع بدل تصديره، فلا يفتح إلا في البرنامج نفسه.","رفع مستوى الصوت حتى يتشوه."]},"g5-t1-u3-2":{s:"الشريط الزمني مثل قطار: كل مقطع عربة، ترتّبها بالترتيب الذي تريد.",m:["ترتيب المقاطع عشوائيًا دون قصة.","الموسيقى أعلى من صوت الكلام."]},"g5-t1-u3-p":{s:"مقدمة، ثم ٣ مقاطع قصيرة مرتبة، ثم خاتمة، مع انتقالات بسيطة.",m:["فيديو طويل بلا هدف واضح.","نسيان التصدير بصيغة يمكن مشاركتها."]},"g5-t1-u4-1":{s:"المبرمج يفكر ثم يكتب ثم يجرّب ثم يصحح، ويعيد ذلك حتى ينجح.",m:["كتابة البرنامج كاملًا دون تجربة أجزائه.","اليأس عند ظهور خطأ، والخطأ جزء طبيعي من البرمجة."]},"g5-t1-u4-2":{s:"الكائن هو الممثل، والمظاهر ملابسه، والمنصة هي المسرح.",m:["برمجة الكائن الخطأ لأنه غير محدد.","الخلط بين المظهر والخلفية."]},"g5-t1-u4-3":{s:"الشرط مثل إشارة المرور: إذا كانت خضراء نمشي، وإلا نقف.",m:["وضع الأوامر في المكان الخطأ داخل «إذا» أو «وإلا».","كتابة شرط لا يمكن أن يتحقق أبدًا."]},"g5-t1-u4-4":{s:"x يمين ويسار، وy فوق وتحت، ومركز المنصة (0،0).",m:["الخلط بين x وy.","نسيان أن القيم السالبة تعني يسارًا أو أسفل."]},"g5-t1-u4-5":{s:"البث مثل جرس المدرسة: عندما يرن يعرف كل طالب ماذا يفعل.",m:["إرسال رسالة باسم وانتظار رسالة باسم مختلف.","نسيان لبنة «عند تلقي» في الكائن الآخر."]},"g5-t1-u4-6":{s:"الاستشعار يجعل البرنامج «يرى» و«يسمع»: يعرف ماذا كتبت أو ماذا لمس الكائن.",m:["مقارنة الإجابة بكلمة مكتوبة بطريقة مختلفة (مسافة زائدة مثلًا).","وضع شرط الاستشعار خارج حلقة «باستمرار» فلا يُفحص إلا مرة."]},"g5-t1-u4-p":{s:"كائن يتحرك بالأسهم، وإذا لمس الجدار يعود للبداية، وإذا وصل الهدف يفوز.",m:["نسيان إعادة الكائن لموقع البداية عند الخسارة.","عدم وضع الأوامر داخل «باستمرار»."]},"g5-t2-u1-1":{s:"الإنترنت هو الطرق، والويب هو المحلات والبيوت على هذه الطرق.",m:["الظن أن الإنترنت والويب شيء واحد.","الظن أن المتصفح هو الإنترنت نفسه."]},"g5-t2-u1-2":{s:"البريد الإلكتروني رسالة لها عنوان وموضوع ونص، ويمكن أن ترفق معها ملفًا.",m:["نسيان إرفاق الملف المذكور في الرسالة.","كتابة رسالة بلا موضوع أو بلا تحية."]},"g5-t2-u1-3":{s:"المشاركة السحابية مثل إعارة كتاب: تحدد هل يقرؤه صديقك فقط أم يكتب فيه.",m:["منح صلاحية «تعديل» لمن يحتاج «العرض» فقط.","مشاركة الملف مع الجميع بدل أشخاص محددين."]},"g5-t2-u1-p":{s:"وزّعوا المهام، وشاركوا ملفًا واحدًا، وكل عضو يعدّل جزأه.",m:["حذف عمل زميل في الملف المشترك.","عدم تحديد من يفعل ماذا."]},"g5-t2-u2-1":{s:"مربع الاسم يخبرك أين تقف، مثل رقم المقعد في القاعة.",m:["الكتابة في خلية غير المقصودة.","الخلط بين ورقة العمل والمصنف."]},"g5-t2-u2-2":{s:"المعادلة تستخدم أسماء الخلايا، فإذا تغيّر الرقم تغيّر الناتج وحده.",m:["استخدام x للضرب بدل *.","كتابة الأرقام بدل مراجع الخلايا."]},"g5-t2-u2-p":{s:"اكتب البنود في عمود، والتكاليف في عمود، ثم اجمع.",m:["نسيان أحد البنود من المجموع.","وضع رمز العملة داخل الخلية مع الرقم."]},"g5-t2-u3-1":{s:"وسائل التواصل مثل ساحة عامة: كن مهذبًا، واحمِ معلوماتك، وأخبر الكبار عن أي إساءة.",m:["قبول طلبات صداقة من غرباء.","الرد على الإساءة بإساءة."]},"g5-t2-u3-2":{s:"المدونة دفتر على الإنترنت، وكل تدوينة صفحة فيه.",m:["كتابة تدوينة طويلة بلا عناوين.","نشر معلومات شخصية في التدوينة."]},"g5-t2-u3-3":{s:"العمل الذي صنعه غيرك مثل ممتلكاته: تستأذن وتذكر اسمه.",m:["نسخ صورة أو نص دون ذكر المصدر.","الظن أن كل ما على الإنترنت مسموح استخدامه."]},"g5-t2-u3-p":{s:"تدوينة علمية بعنوان جذاب، وصورة مسموح بها، ومصدر مذكور.",m:["نسيان ذكر المصادر.","اختيار تصنيف لا يناسب الموضوع."]},"g5-t2-u4-1":{s:"الروبوت آلة تنفذ ما بُرمج عليه، في المصانع والبيوت والمستشفيات.",m:["الظن أن كل روبوت يشبه الإنسان.","الظن أن الروبوت يعمل دون برمجة."]},"g5-t2-u4-2":{s:"بدل أن تكتب الأمر ١٠ مرات، ضعه داخل «كرر ١٠».",m:["وضع أوامر لا تتكرر داخل الحلقة.","اختيار عدد تكرار خاطئ."]},"g5-t2-u4-3":{s:"المكعب مربعات متصلة؛ ارسم مربعًا بالتكرار ثم انقل الروبوت وارسم الثاني.",m:["استخدام زاوية غير ٩٠ في المربع.","نسيان رفع القلم عند الانتقال دون رسم."]},"g5-t2-u4-x":{s:"الذكاء الاصطناعي يتعلم من بيانات كثيرة ثم يتوقع، مثل الخرائط التي تقترح أسرع طريق.",m:["الظن أنه دائمًا على صواب.","الظن أنه يفكر ويشعر مثل الإنسان."]},"g5-t2-u4-p":{s:"خطط للمسار في المستودع، ثم برمج الروبوت بالتكرار والانعطافات.",m:["البرمجة قبل رسم المسار.","عدم تجربة كل جزء من المسار."]}}),Object.assign(EXU,{"g6-t1-u1":{home:"اطلب من ابنك أن يقيس غرض في البيت (صندوق مثلًا) بطوله وعرضه وارتفاعه، ثم يصممه في برنامج ثلاثي الأبعاد بالمقاسات نفسها.",q:["ما الشكل ثلاثي الأبعاد؟|شكل له طول وعرض وارتفاع|شكل له طول فقط|رسم على ورقة فقط|صورة ملونة|الأشكال ثلاثية الأبعاد مجسمات.","ما مساحة العمل في برامج التصميم ثلاثي الأبعاد؟|المكان الذي نبني فيه النموذج|شريط الأدوات|سلة المحذوفات|نافذة الحفظ|مساحة العمل مثل الطاولة التي نبني عليها.","ما النموذج ثلاثي الأبعاد؟|تصميم لجسم على الحاسب|صورة فوتوغرافية|نص مكتوب|جدول بيانات|النموذج يمثل جسمًا يمكن تدويره ورؤيته من كل الجهات.","ما التداخل في التصميم ثلاثي الأبعاد؟|دخول شكل في شكل آخر|حذف الشكل|تلوين الشكل|طباعة الشكل|التداخل يجمع الأشكال لبناء تصميم جديد.","أيّ مما يلي من أبعاد الشكل؟|العمق|اللون|الاسم|الامتداد|الأبعاد: العرض والعمق والارتفاع.","كيف نصنع فتحة نافذة في جدار التصميم؟|نستخدم شكلًا مفرغًا (ثقبًا) داخل الجدار|نلوّن الجدار|نحذف الجدار|نكبّر الجدار|الشكل المفرغ يقطع جزءًا من الشكل الآخر.","لماذا ندوّر منظور الكاميرا أثناء التصميم؟|لنرى النموذج من جميع الجهات|لتغيير لونه|لحذفه|لا فائدة|رؤية النموذج من زوايا مختلفة تكشف الأخطاء.","أين يُستخدم التصميم ثلاثي الأبعاد؟|في العمارة والألعاب والطباعة ثلاثية الأبعاد|في البريد فقط|في الحاسبة|في الطباعة العادية فقط|له استخدامات كثيرة في الحياة."]},"g6-t1-u2":{home:"اسألا أفراد العائلة عن رياضتهم المفضلة، ودع ابنك يسجّل الإجابات في جدول، ويحسب المجموع والمتوسط، ويرسم مخططًا بيانيًا.",q:["ما الدالة؟|صيغة جاهزة تجري عملية حسابية|خلية فارغة|نوع خط|اسم الورقة|مثل SUM وAVERAGE.","ما النطاق B2:B6؟|الخلايا من B2 إلى B6|الخليتان B2 وB6 فقط|العمود B كله|الصف 2 كله|النقطتان تعنيان «إلى».","أيّ دالة تحسب المتوسط؟|AVERAGE|SUM|MAX|COUNT|AVERAGE تجمع الأرقام وتقسمها على عددها.","أيّ دالة تعطي أكبر قيمة؟|MAX|MIN|SUM|AVERAGE|MAX تعطي أكبر رقم في النطاق.","ما المخطط البياني؟|رسم يمثل البيانات|جدول نصي|صورة من الإنترنت|خلية ملونة|المخطط يجعل الأرقام سهلة الفهم.","ما وسيلة الإيضاح؟|مفتاح يوضح ألوان المخطط|عنوان الجدول|اسم الملف|رقم الصفحة|وسيلة الإيضاح تبيّن ماذا يمثل كل لون.","أيّ مخطط يناسب مقارنة أعداد الطلاب في كل رياضة؟|المخطط العمودي|لا يوجد|نص فقط|صورة|الأعمدة تسهّل المقارنة بين الفئات.","ما تسميات البيانات؟|الأرقام الظاهرة على المخطط|أسماء الأوراق|عناوين الأعمدة في الجدول|لون الخلفية|تسميات البيانات توضح القيمة الدقيقة."]},"g6-t1-u3":{home:"اصنعا معًا «قاعدة بيانات» ورقية لكتب البيت: العنوان، والمؤلف، والسنة. ثم اسأل ابنك: ما الحقول؟ وما السجلات؟ ورتّبها حسب السنة.",q:["ما السجل في قاعدة البيانات؟|صف فيه بيانات عنصر واحد|عمود كامل|اسم القاعدة|نوع البيانات|كل طالب في جدول الطلاب سجل.","ما الحقل؟|عمود فيه نوع واحد من البيانات|صف كامل|القاعدة كلها|ملف منفصل|مثل حقل «الاسم» أو «العمر».","ما المفتاح الأساسي؟|حقل لا تتكرر قيمه ويميز كل سجل|أول حقل دائمًا|كلمة المرور|حقل الاسم دائمًا|مثل رقم الطالب الذي لا يتكرر.","أيّ نوع بيانات يناسب «تاريخ الميلاد»؟|تاريخ|نص|رقم|صورة|نوع التاريخ يسمح بترتيب التواريخ بشكل صحيح.","ما الفرز؟|ترتيب السجلات|حذف السجلات|إظهار سجلات محددة فقط|إضافة حقل|الفرز يرتب تصاعديًا أو تنازليًا.","ما التصفية؟|إظهار السجلات المطابقة لشرط فقط|ترتيب السجلات|حذف القاعدة|تغيير نوع البيانات|التصفية تخفي ما لا يطابق الشرط ولا تحذفه.","لماذا لا يصلح «الاسم» مفتاحًا أساسيًا؟|لأن الأسماء قد تتكرر|لأنه طويل|لأنه نص|لا مانع|المفتاح الأساسي يجب ألا يتكرر.","ما الجدول في قاعدة البيانات؟|بيانات موضوع واحد في صفوف وأعمدة|صورة|مخطط بياني|رسالة|كل جدول لموضوع واحد مثل الطلاب أو الكتب."]},"g6-t1-u4":{home:"العبا «خمّن الرقم»: يختار ابنك رقمًا وتخمّن أنت، ويجيب «أكبر» أو «أصغر». ثم اطلب منه أن يبرمج اللعبة في سكراتش بمتغير وشروط.",q:["ما المتغير؟|مكان في الذاكرة يحفظ قيمة تتغير|لبنة حركة|خلفية|صوت|مثل متغير النقاط في اللعبة.","ما نتيجة الشرط (5 > 3)؟|صحيح|خطأ|5|3|خمسة أكبر من ثلاثة، فالشرط صحيح.","متى يتحقق الشرط المركب «و»؟|إذا تحقق الشرطان معًا|إذا تحقق أحدهما|إذا لم يتحقق أي منهما|دائمًا|«و» تحتاج الشرطين معًا.","متى يتحقق الشرط المركب «أو»؟|إذا تحقق أحد الشرطين على الأقل|إذا تحقق الشرطان فقط|إذا لم يتحقق أي منهما|أبدًا|«أو» يكفيها شرط واحد.","ما الإحداثيات؟|عددان يحددان موقع النقطة|لون الكائن|سرعة الكائن|اسم الكائن|(x, y) يحددان المكان على المنصة.","ما النمط في البرمجة؟|مجموعة خطوات تتكرر بالترتيب نفسه|خطأ في البرنامج|نوع خلفية|صوت|اكتشاف النمط يسهّل استخدام التكرار.","ما فائدة «اذهب إلى موقع عشوائي» في الألعاب؟|جعل الهدف يظهر في أماكن غير متوقعة|إيقاف اللعبة|حذف الكائن|تكبير المنصة|العشوائية تجعل اللعبة ممتعة.","بأيّ لون تظهر لبنات العمليات الحسابية في سكراتش؟|أخضر|أزرق|بنفسجي|أصفر|لبنات العمليات خضراء."]},"g6-t2-u1":{home:"اطلب من ابنك أن يصمم جدولًا لمهام البيت الأسبوعية: الأيام في الصفوف، والمهام في الأعمدة، مع عنوان مدمج ونمط جدول جميل، ثم يطبعه ويعلّقه.",q:["ما دمج الخلايا؟|جعل عدة خلايا خلية واحدة|حذف الخلايا|تلوين الخلايا|نسخ الخلايا|نستخدمه لعناوين الجداول.","ما نمط الجدول؟|تنسيق جاهز بالألوان والحدود|نوع خط|حجم الصفحة|عدد الأعمدة|الأنماط تنسّق الجدول بنقرة.","ما الهوامش؟|المسافة بين النص وحافة الصفحة|الخط تحت العنوان|الصورة في الصفحة|رقم الصفحة|الهوامش تحدد المساحة البيضاء حول النص.","ما الرأس في المستند؟|نص يظهر أعلى كل صفحة|عنوان الفقرة الأولى فقط|الصورة الأولى|اسم الملف|نضع في الرأس مثلًا اسم المدرسة.","لماذا نقسم النص إلى أعمدة؟|لتصميم يشبه الصحف والمجلات|لحذف النص|لطباعته بالألوان|لتكبير الخط|الأعمدة تناسب النشرات والمطويات.","كيف نضيف صفًا جديدًا في جدول؟|من أدوات الجدول: إدراج صف|بالضغط على Delete|بحذف الجدول|بتغيير الخط|أدوات التخطيط تضيف الصفوف والأعمدة.","ما الجدول في المستند؟|بيانات مرتبة في صفوف وأعمدة|صورة|نص طويل|رابط|الجدول ينظم المعلومات.","ما الفرق بين الرأس والتذييل؟|الرأس أعلى الصفحة والتذييل أسفلها|لا فرق|التذييل أعلى الصفحة|الرأس في الصفحة الأولى فقط|كلاهما يتكرر في كل صفحة."]},"g6-t2-u2":{home:"تصفّحا معًا موقعًا رسميًا (مثل موقع وزارة التعليم)، ودع ابنك يشير إلى: قائمة التنقل، والسمة والألوان، وعنوان الويب. ثم يخطط على ورقة لموقع عن هوايته.",q:["ما الموقع الإلكتروني؟|مجموعة صفحات على الإنترنت|برنامج على الحاسب فقط|ملف صوتي|جدول بيانات|الموقع يتكون من صفحات مترابطة.","ما السمة في تصميم الموقع؟|ألوان الموقع وتصميمه العام|عنوان الموقع|كلمة المرور|عدد الصفحات|السمة توحّد شكل الموقع.","ما قائمة التنقل؟|روابط الصفحات أعلى الموقع|أسفل الصفحة فقط|صورة الخلفية|محرك البحث|قائمة التنقل تساعد الزائر على التنقل بين الصفحات.","ما النشر؟|إتاحة الموقع على الإنترنت|حذف الموقع|طباعة الموقع|حفظه على الحاسب فقط|بعد النشر يستطيع الناس زيارته.","ما عنوان الويب؟|الرابط الذي نفتح به الموقع|اسم الصفحة الأولى|اسم المصمم|البريد الإلكتروني|مثل https://www.example.com.","ماذا نراجع قبل نشر الموقع؟|الروابط والأخطاء والصور وحقوقها|لون المتصفح|سرعة الحاسب|لا شيء|المراجعة تجعل الموقع احترافيًا.","لماذا نستخدم سمة واحدة لكل الصفحات؟|ليبدو الموقع متناسقًا|لأنها إجبارية|لتقليل الصفحات|لا فائدة|التناسق يريح الزائ  في أسفل الشاشة، وفيه زر ابدأ والبرامج المفتوحة."],["سلة المحذوفات","مكان تُحفظ فيه الملفات المحذوفة مؤقتًا."]],sum:["سطح المكتب أول ما يظهر بعد تشغيل الحاسب.","الأيقونات تمثل البرامج والملفات، ونفتحها بنقر مزدوج.","زر ابدأ يفتح قائمة البرامج، وشريط المهام في أسفل الشاشة.","الملفات المحذوفة تذهب إلى سلة المحذوفات."]},"t1-u1-3":{goals:["تفتح إعدادات الحاسب.","تغيّر خلفية سطح المكتب.","تضبط الصوت والسطوع والوضع الداكن."],explain:["من تطبيق الإعدادات نخصّص الحاسب: نغيّر الخلفية والألوان من «التخصيص»، ونضبط الصوت والسطوع من «النظام».","الوضع الداكن يجعل الألوان غامقة فيريح العينين ليلًا، وخفض السطوع يوفر الطاقة ويريح النظر."],terms:[["الإعدادات","تطبيق نضبط منه خصائص الحاسب."],["الخلفية","الصورة أو اللون الذي يظهر خلف أيقونات سطح المكتب."],["السطوع","درجة إضاءة الشاشة."]],sum:["نفتح الإعدادات من زر ابدأ.","التخصيص لتغيير الخلفية والألوان والوضع الداكن.","النظام لضبط الصوت والسطوع.","خفض السطوع ليلًا يريح العينين."]},"t1-u1-p":{goals:["تحفظ عملك قبل إغلاق البرامج.","تغلق البرامج المفتوحة.","توقف تشغيل الحاسب بالطريقة الآمنة."],explain:["إيقاف الحاسب بطريقة خاطئة، مثل نزع سلك الكهرباء، قد يضيّع عملك أو يتلف الملفات.","الطريقة الآمنة: احفظ عملك، ثم أغلق البرامج، ثم اضغط زر ابدأ ← الطاقة ← إيقاف التشغيل."],terms:[["الحفظ","تخزين العمل في ملف حتى لا يضيع."],["إيقاف التشغيل","إطفاء الحاسب بالطريقة الصحيحة من زر الطاقة."]],sum:["احفظ عملك أولًا.","أغلق البرامج المفتوحة.","ابدأ ← الطاقة ← إيقاف التشغيل.","لا تنزع سلك الكهرباء لإطفاء الحاسب."]},"t1-u2-1":{goals:["تتعرّف أقسام لوحة المفاتيح.","تستخدم المفاتيح الخاصة: المسافة وEnter وBackspace وShift.","تبدّل بين اللغتين العربية والإنجليزية."],explain:["لوحة المفاتيح جهاز إدخال نكتب به الحروف والأرقام والرموز. فيها مفاتيح للحروف، وأخرى للأرقام، ومفاتيح خاصة.","مفتاح المسافة يفصل بين الكلمات، وEnter ينقلنا إلى سطر جديد، وBackspace يحذف الحرف الذي قبل المؤشر، وShift يكتب الحرف الكبير أو الرمز العلوي.","للتبديل بين العربية والإنجليزية نضغط Alt مع Shift."],terms:[["المؤشر","الخط الذي يومض ويحدد مكان الكتابة."],["Enter","مفتاح الانتقال -1":{goals:["تتعرّف المتصفح والموقع الإلكتروني.","تكتب عنوان الموقع في شريط العنوان.","تستخدم أزرار الرجوع والمفضلة."],explain:["الموقع الإلكتروني مجموعة صفحات على الإنترنت، ونفتحه ببرنامج اسمه المتصفح.","نكتب عنوان الموقع في شريط العنوان ثم نضغط انتقال. وننتقل بين الصفحات بالروابط، ونعود بزر الرجوع، ونحفظ المواقع المهمة في المفضلة."],terms:[["المتصفح","برنامج نفتح به المواقع الإلكترونية."],["الرابط","نص أو صورة ننقر عليها لننتقل إلى صفحة أخرى."],["المفضلة","قائمة نحفظ فيها المواقع لنعود إليها بسرعة."]],sum:["نفتح المواقع بالمتصفح.","نكتب العنوان في شريط العنوان.","الرابط ينقلنا إلى صفحة أخرى، وزر الرجوع يعيدنا.","نجمة المفضلة تحفظ الموقع."]},"t1-u3-2":{goals:["تستخدم محرك البحث.","تختار كلمات بحث دقيقة.","تبحث عن الصور."],explain:["محرك البحث موقع يساعدنا على إيجاد المعلومات. نكتب فيه كلمات قليلة ودقيقة عن موضوعنا.","نتجاهل الإعلانات، ونختار النتائج من المواقع الموثوقة، ونستخدم قسم الصور للبحث عن صورة."],terms:[["محرك البحث","موقع نبحث فيه عن المعلومات."],["الكلمات المفتاحية","كلمات قصيرة ودقيقة نكتبها للبحث."]],sum:["اكتب كلمات قليلة ودقيقة.","تجنّب الإعلانات.","اختر نتيجة من موقع موثوق.","ابحث عن الصور من قسم «صور»."]},"t1-u3-3":{goals:["تميّز المصدر الموثوق من غير الموثوق.","تقارن بين أكثر من مصدر."],explain:["ليست كل المعلومات على الإنترنت صحيحة. المصدر الموثوق كاتبه معروف، مثل المواقع الحكومية والتعليمية والموسوعات.","عندما تختلف المعلومات، قارن بين أكثر من مصدر، واختر المصدر الرسمي."],terms:[["المصدر الموثوق","موقع معروف الكاتب ومعلوماته صحيحة."]],sum:["تحقق من كاتب المعلومة.","المواقع الحكومية والتعليمية أوثق.","قارن بين أكثر من مصدر."]},"t1-u3-4":{goals:["تنشئ كلمة مرور قوية.","تضبط إعدادات الخصوصية.","تتعامل بأمان مع الرسائل المخادعة."],explain:["كلمة المرور القوية طويلة (٨ رموز فأكثر)، وفيها حروف كبيرة وصغيرة وأرقام ورموز، ولا نعطيها لأحد.","نخفي معلوماتنا الشخصية، ولا نفتح الروابط في الرسائل الغريبة، ونبلّغ عن أي رسالة تطلب كلمة المرور."],terms:[["كلمة المرور","رمز سري يحمي حسابك."],["الخصوصية","حماية معلوماتك الشخصية من الآخرين."]],sum:["كلمة مرور قوية: ٨ رموز فأكثر، حروف وأرقام ورموز.","أخفِ معلوماتك الشخصية.","لا تفتح روابط الرسائل الغريبة، وبلّغ عنها."]},"t1-u3-p":{goals:["تبحث بأمان عن معلومة.","تتجنب الإعلانات المخادعة.","تختار المصدر الموثوق."],explain:["في المشروع تطبّق ما تعلمته: تبحث عن معلومة، وتتجنب الإعلانات المخادعة، وتختار مصدرًا موثوقًا."],terms:[],sum:["ابحث بكلمات دقيقة.","أغلق الإعلانات ولا تضغط «استلم الجائزة».","اختر المصدر الموثوق."]},"t1-u4-1":{goals:["تتعرّف واجهة سكراتش.","تحرّك الكائن باللبنات.","تشغّل البرنامج بالعلم الأخضر."],explain:["سكراتش لغة برمجة نبني فيها البرامج بلبنات ملونة نركّبها مثل قطع الألعاب.","نختار اللبنات من قسم الحركة، ونرتبها تحت لبنة «عند نقر العلم الأخضر»، ثم نضغط العلم لتشغيل البرنامج."],terms:[["الكائن","الشخصية التي نبرمجها."],["اللبنة","قطعة أمر برمجي."],["البرنامج","مجموعة أوامر مرتبة."]],sum:["البرنامج أوامر مرتبة.","نبني البرنامج بتركيب اللبنات.","العلم الأخضر يشغّل البرنامج."]},"t1-u4-2":{goals:["تستخدم لبنات الحركة والدوران.","ترتّب الأوامر لتصل إلى الهدف."],explain:["ترتيب اللبنات مهم: الكائن ينفّذ الأوامر من الأعلى إلى الأسفل.","نستخدم «تحرك» للتقدم، و«استدر» لتغيير الاتجاه."],terms:[["الخوارزمية","خطوات مرتبة لحل مشكلة."]],sum:["الأوامر تُنفّذ بالترتيب.","تحرك للتقدم، واستدر لتغيير الاتجاه."]},"t1-u4-3":{goals:["تستخدم لبنة التكرار.","تختصر البرنامج بتكرار الأوامر."],explain:["عندما نكرر الأوامر نفسها، نضعها داخل لبنة «كرر» بدل كتابتها مرات كثيرة. فيصبح البرنامج أقصر وأسهل."],terms:[["التكرار","تنفيذ مجموعة أوامر عددًا من المرات."]],sum:["لبنة «كرر» تعيد الأوامر.","التكرار يختصر البرنامج."]},"t1-u4-4":{goals:["تستخدم لبنات القلم.","ترسم أشكالًا هندسية بالتكرار."],explain:["بلبنات القلم يرسم الكائن أثناء حركته. نُنزل القلم، ثم نتحرك ونستدير.","المربع: كرر ٤ مرات «تحرك ١٠٠ ثم استدر ٩٠». والمثلث: كرر ٣ مرات «تحرك ثم استدر ١٢٠»."],terms:[["أنزل القلم","أمر يجعل الكائن يرسم أثناء الحركة."]],sum:["أنزل القلم قبل الرسم.","المربع: ٤ تكرارات بزاوية ٩٠.","المثلث: ٣ تكرارات بزاوية ١٢٠."]},"t1-u4-p":{goals:["ترسم شكلًا مغلقًا بالتكرار."],explain:["في المشروع ترسم مث
