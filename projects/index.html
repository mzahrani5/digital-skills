/* Layout: a single narrow column on a pixel-grid "digital notebook" ground; a navy subject band on top, lesson pages as stacked task sections. */
:root{
  --bg:#edf2f6; --surface:#ffffff; --surface-2:#f5f8fb; --ink:#14283d; --muted:#596b7d; --line:#d3dde6;
  --band:#16324f; --band-ink:#f3f7fb; --band-muted:#a9bfd3;
  --accent:#e8692f; --accent-ink:#ffffff; --teal:#17806f; --sun:#f6c445;
  --ok:#17844e; --ok-bg:#e1f4e8; --bad:#c93b3b; --bad-bg:#fbe4e4;
  --wa:#1f9d55; --grid:rgba(22,50,79,.055);
  --doc:#ffffff; --doc-ink:#1b1b1b; --doc-line:#d9d9d9;
  --motion:#3e7fd6; --pen:#22a06b; --control:#e59a1f;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1923; --surface:#152331; --surface-2:#1a2b3b; --ink:#e5edf4; --muted:#9db1c3; --line:#26394b;
  --band:#0b2136; --band-ink:#f0f5fa; --band-muted:#8fa9c0;
  --accent:#ff8650; --accent-ink:#1a0c04; --teal:#3fc2ab; --sun:#f6c445;
  --ok:#45d08a; --ok-bg:#143628; --bad:#ff7a7a; --bad-bg:#3b1c1f;
  --wa:#2fbf6c; --grid:rgba(229,237,244,.045);
  --motion:#5b97e8; --pen:#36b981; --control:#eaa634;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1923; --surface:#152331; --surface-2:#1a2b3b; --ink:#e5edf4; --muted:#9db1c3; --line:#26394b;
  --band:#0b2136; --band-ink:#f0f5fa; --band-muted:#8fa9c0;
  --accent:#ff8650; --accent-ink:#1a0c04; --teal:#3fc2ab; --sun:#f6c445;
  --ok:#45d08a; --ok-bg:#143628; --bad:#ff7a7a; --bad-bg:#3b1c1f;
  --wa:#2fbf6c; --grid:rgba(229,237,244,.045);
  --motion:#5b97e8; --pen:#36b981; --control:#eaa634;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
#app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.band{background:var(--band);color:var(--band-ink);border-radius:20px;padding:22px 20px 18px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto auto -1px -1px;width:120px;height:72px;
  background:conic-gradient(from 90deg at 0 0,transparent 0 0) ,
  linear-gradient(var(--accent),var(--accent)) 0 48px/24px 24px no-repeat,
  linear-gradient(var(--sun),var(--sun)) 24px 48px/24px 24px no-repeat,
  linear-gradient(var(--teal),var(--teal)) 0 24px/24px 24px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 48px 48px/24px 24px no-repeat;opacity:.9}
.eyebrow{font-size:13px;letter-spacing:.02em;color:var(--band-muted);font-weight:600}
.teacher-band{background:linear-gradient(135deg,#0f5c52,#17806f)}.teacher-band .grade{color:#ffe39a}
.band h1{font-size:clamp(30px,8vw,44px);font-weight:800;margin-top:2px}
.band .grade{font-size:17px;font-weight:600;color:var(--sun)}
.ids{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px;padding-inline-end:70px}
.id{display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}
.id small{font-size:12px;color:var(--band-muted)}
.id b{font-weight:600;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select,textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:96px;resize:vertical;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none;min-height:46px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn.teal{background:var(--teal);color:var(--surface)}
.btn.wa{background:var(--wa);color:#fff;font-size:17px}
.btn[aria-disabled=true],.btn:disabled{opacity:.45;pointer-events:none}
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-t h2{font-size:22px}
.sec-t .tag{margin-inline-start:auto}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* student */
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--sun);color:#3d2a00;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;flex:none}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--band);color:var(--band-ink)}

.unit{display:flex;flex-direction:column;gap:8px}
.unit-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.unit-n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent)}
.unit-h h3{font-size:20px}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.lesson:hover{border-color:var(--accent)}
.lesson .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1.5px dashed var(--line);font-weight:800;font-size:14px;color:var(--muted)}
.lesson.done .dot{background:var(--ok-bg);border:1.5px solid var(--ok);color:var(--ok)}
.lesson.proj{background:var(--surface-2)}
.lesson small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.lesson b{font-weight:700;font-size:16px;display:block;min-width:0}
.lesson .score{font-weight:800;color:var(--ok);font-size:14px}

/* lesson page */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.l-head{display:flex;flex-direction:column;gap:6px}
.l-head .meta{font-size:13px;font-weight:700;color:var(--accent)}
.l-head h1{font-size:clamp(28px,7vw,38px);font-weight:800}
.l-head .ctx{font-size:13px;color:var(--muted)}
.idea{background:var(--surface-2);border-inline-start:4px solid var(--sun);border-radius:10px;padding:12px 14px}
.idea b{display:block;font-size:13px;color:var(--muted)}
.intro{margin-bottom:12px;font-weight:500}
.hint{font-size:14px;color:var(--muted)}
.msg{font-weight:700;font-size:15px;min-height:1.7em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.goals li{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.goals li::before{content:"";flex:none;width:16px;height:16px;margin-top:5px;border-radius:5px;border:2px solid var(--line)}
.goals li.on{color:var(--ink)}
.goals li.on::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--surface)}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.q+.q{border-top:1px dashed var(--line);padding-top:14px}
.q-t{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:start;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.opt.sel{border-color:var(--band);background:color-mix(in srgb,var(--band) 10%,var(--surface));font-weight:700}
.hs-tap{animation:pop .35s;outline:3px solid var(--band)!important;outline-offset:1px}
.goals.plain li::before{width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--muted);border:0}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);font-weight:700}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}

/* sort */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pool{padding:10px;border-radius:12px;background:var(--surface-2);min-height:48px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:15px;text-align:start}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg)} .chip.bad{border-color:var(--bad);background:var(--bad-bg)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
.bucket{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:90px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.bucket.ready{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.bucket-t{font-weight:800;font-family:var(--f-display);font-size:17px}

/* order */
.olist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:o}
.olist li{counter-increment:o;display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.olist li::before{content:counter(o);font-weight:800;color:var(--accent);min-width:1.2em}
.olist li.ok{border-color:var(--ok);background:var(--ok-bg)} .olist li.bad{border-color:var(--bad);background:var(--bad-bg)}
.olist .empty{border-style:dashed;color:var(--muted);font-weight:500}
.olist .empty::before{content:""}

/* scenes */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.prompt{font-weight:700;font-size:16px;background:var(--band);color:var(--band-ink);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.hs-ok{animation:pop .5s;outline:3px solid #2fbf6c!important;outline-offset:1px}
.hs-bad{animation:shake .4s;outline:3px solid #e05050!important}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.desk{border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 75% 110%,#7ec8ff 0,#3d8fe0 30%,transparent 60%),radial-gradient(90% 80% at 15% 0%,#2a5fb8 0,transparent 60%),linear-gradient(160deg,#0f2d6b,#1d5bbf 55%,#58a8f0);display:flex;flex-direction:column;aspect-ratio:16/10;max-width:100%;border:3px solid #10243a;min-height:240px}
.desk-icons{flex:1;display:grid;grid-template-columns:repeat(auto-fill,76px);grid-auto-rows:min-content;gap:8px;padding:10px;align-content:start}
.d-icon{background:transparent;border:0;border-radius:8px;color:#fff;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.d-icon:hover{background:rgba(255,255,255,.18)}
.d-ic svg{width:42px;height:42px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.taskbar{background:rgba(24,34,48,.82);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:4px;padding:5px 6px;color:#e6eef5}
.tb{background:transparent;border:0;border-radius:6px;padding:4px 5px;white-space:nowrap;flex:none;color:#e6eef5;display:flex;align-items:center;gap:4px;font-size:12px;min-height:34px}
.tb svg{width:24px;height:24px}.tb:hover{background:rgba(255,255,255,.12)}
.tb.search{background:rgba(255,255,255,.14);flex:0 1 90px;color:#d6e1ec;border-radius:99px;padding-inline:12px}
.tb-gap{flex:1;min-width:4px}@media (max-width:480px){.tb.pin{display:none}}.tb.clock{flex-direction:column;gap:0;line-height:1.2;font-size:11px}.tb.clock small{font-size:9.5px;opacity:.85}
.kbd{direction:ltr;display:flex;flex-direction:column;gap:6px;background:linear-gradient(#3a4552,#252e38);padding:10px;border-radius:14px;min-width:600px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.25)}
.krow{display:flex;gap:5px}
.key{flex:1 1 0;min-width:0;height:44px;border-radius:8px;border:0;background:linear-gradient(#ffffff,#e3e9ef);color:#1b2733;font-weight:700;font-size:15px;box-shadow:0 3px 0 #8996a4,0 4px 6px rgba(0,0,0,.25);transition:transform .08s}.key:active{transform:translateY(2px);box-shadow:0 1px 0 #8996a4}
.key.fn{background:linear-gradient(#e6ecf2,#cdd7e1);font-size:12px}
table.sheet{border-collapse:collapse;direction:rtl;font-variant-numeric:tabular-nums;background:#fff;color:#1b1b1b}
.sheet th{background:#e9eef3;color:#3c4c5c;font-weight:600;font-size:13px;border:1px solid #c5cfd8;padding:4px 8px;min-width:26px}
.sheet td{border:1px solid #d5dde5;min-width:70px;height:34px;padding:0;font-size:14px;text-align:center}
.sheet td[data-hs]{cursor:pointer}
.sheet td input{width:100%;min-width:74px;height:34px;border:0;background:transparent;text-align:center;padding:0 4px;box-sizing:border-box;color:var(--doc-ink)}
.sheet td input:focus{outline:none;background:#f6fbf8}
.sheet td input[readonly]{font-weight:600;color:#2a3a4a}
.fbar{display:flex;gap:6px;align-items:center;direction:ltr;margin-bottom:6px;font-size:14px;background:#fff;border:1px solid #d6dbe0;padding:4px;border-radius:4px}.fbar .fx{font-style:italic;font-weight:700;color:#555}
.fbar b{background:#fff;border:1px solid #d6dbe0;color:#1b1b1b;border-radius:6px;padding:2px 10px;min-width:40px;text-align:center}
.fbar span{flex:1;border:1px solid #d6dbe0;border-radius:3px;padding:2px 10px;background:#fff;color:#1b1b1b;min-height:1.7em;overflow:hidden;white-space:nowrap}

/* settings */
.mini{border-radius:12px;border:4px solid #10243a;aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;transition:background .3s,filter .3s}
.mini .win{position:absolute;inset:16% 18% 24% 18%;border-radius:8px;padding:8px;font-size:12px;transition:background .3s,color .3s}
.mini .vol{position:absolute;bottom:8px;left:8px;right:8px;height:8px;border-radius:9px;background:rgba(0,0,0,.25)}
.mini .vol i{display:block;height:100%;border-radius:9px;background:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:10px;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 12px;font-weight:600;min-height:38px}
.seg button[aria-pressed=true]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:12px}
.ctrl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctrl>span{font-size:13px;font-weight:700;color:var(--muted)}

/* doc */
.doc{background:var(--doc);color:var(--doc-ink);border:1px solid var(--doc-line);border-radius:6px;padding:22px 20px;min-height:120px;box-shadow:0 2px 0 var(--doc-line)}
.doc p,.doc li{margin:0}
.doc ul{margin:0;padding-inline-start:22px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.tbtn{min-width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 10px}
.tbtn[aria-pressed=true]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.tsep{width:1px;background:var(--line);margin-inline:2px}
.words{display:flex;flex-wrap:wrap;gap:6px;font-size:18px;margin-top:8px}
.words span{padding:1px 8px;border-radius:6px}
.words .ok{background:var(--ok-bg);color:var(--ok)} .words .bad{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}

/* code */
.code{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.code{grid-template-columns:1fr 1fr}}
.stage{position:relative;display:grid;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;overflow:hidden;max-width:100%;max-height:380px;margin-inline:auto;width:100%}
.cell{border:1px solid var(--line);display:grid;place-items:center}
.cell svg{width:70%;height:70%}
.cell.wall{background:repeating-linear-gradient(45deg,var(--muted) 0 6px,var(--line) 6px 12px)}
.sprite{position:absolute;top:0;left:0;transition:transform .32s ease;display:grid;place-items:center;pointer-events:none}
.sprite .in{width:82%;height:82%;transition:transform .3s;display:block}
.sprite svg{width:100%;height:100%;display:block}
.sprite.bump .in{animation:shake .35s}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.blk{border:0;border-radius:8px;padding:7px 12px;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-height:40px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.blk.motion{background:var(--motion)} .blk.pen{background:var(--pen)} .blk.control{background:var(--control);color:#2b1a00}
.blk select{background:rgba(255,255,255,.85);border:0;border-radius:6px;padding:2px 4px;width:auto;color:#2b1a00}
.blk button{background:transparent;border:0;color:inherit;font-weight:800;padding:0}
.prog{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border:1.5px dashed var(--line);border-radius:12px;min-height:120px;max-height:300px;overflow:auto}
.prog .blk{width:fit-content}
.prog .blk.now{outline:3px solid var(--ink)}
.prog-empty{color:var(--muted);font-size:14px}
.prog-start{background:#3aa45a;color:#fff;border-radius:8px 8px 8px 0;padding:5px 12px;font-weight:800;width:fit-content;font-size:14px}
canvas.pen{width:100%;max-width:340px;aspect-ratio:1;display:block;margin-inline:auto;border:2px solid var(--line);border-radius:12px;background:var(--surface-2)}

/* slide */
.slide{aspect-ratio:16/9;max-width:100%;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5%;box-sizing:border-box;text-align:center;background:#fff;color:#1b1b1b}
.slide h4{margin:0;font-family:var(--f-display);font-size:clamp(20px,6vw,34px);line-height:1.2;position:relative;z-index:2}
.slide h4.wa{background:linear-gradient(180deg,#ffb347,#e8692f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
.slide p{font-size:clamp(13px,3.5vw,18px);position:relative;z-index:2;opacity:.85}
.slide .pic{position:absolute;inset-inline-start:6%;bottom:8%;max-height:58%;object-fit:contain;z-index:1}
.slide .pic.frame{border:5px solid #fff;box-shadow:0 0 0 2px #888;background:#fff}
.slide .pic.shadow{filter:drop-shadow(6px 8px 6px rgba(0,0,0,.4))}
.slide .pic.round{border-radius:50%;background:#fff;padding:6px;aspect-ratio:1;object-fit:cover}
.pics{display:flex;gap:6px;flex-wrap:wrap}
.pics button{width:54px;height:54px;border-radius:10px;border:2px solid var(--line);background:var(--doc);padding:4px}
.pics button[aria-pressed=true]{border-color:var(--accent)}
.pics img{width:100%;height:100%;object-fit:contain}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tr-fade{animation:fadeIn .8s}
.tr-push{animation:pushIn .7s}
.tr-zoom{animation:zoomIn .7s}
.an-appear{animation:fadeIn .6s both}
.an-fly{animation:flyIn .7s both}
.an-pulse{animation:pulse .9s 2}
@keyframes fadeIn{from{opacity:0}}
@keyframes pushIn{from{transform:translateX(100%)}}
@keyframes zoomIn{from{transform:scale(.3);opacity:0}}
@keyframes flyIn{from{transform:translateY(120%);opacity:0}}
@keyframes pulse{50%{transform:scale(1.12)}}

/* photo / gallery */
.viewer{position:relative;border-radius:12px;overflow:hidden;background:#111;display:grid;place-items:center;aspect-ratio:3/2;max-width:100%}
.viewer img,.viewer canvas{max-width:100%;max-height:100%;display:block;transition:transform .35s}
.viewer .cap{position:absolute;bottom:0;inset-inline:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;padding:18px 12px 8px;font-size:14px;font-weight:600}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs button{flex:none;width:64px;height:44px;border-radius:8px;border:2px solid var(--line);padding:0;overflow:hidden;background:#111}
.thumbs button[aria-current=true]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.prog-line{height:6px;background:rgba(255,255,255,.25);position:absolute;bottom:0;left:0;right:0}
.prog-line i{display:block;height:100%;background:var(--accent);width:0}

/* send */
.send{border:2px solid var(--wa);background:color-mix(in srgb,var(--wa) 7%,var(--surface))}
.scorebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;color:var(--wa)}
.parts{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.parts span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
pre.preview{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--f-body);font-size:13.5px;max-height:220px;overflow:auto;margin:0;user-select:text}
.note{font-size:13px;color:var(--muted)}
.foot{font-size:14px;color:var(--muted)}
.foot h3{font-size:17px;color:var(--ink);margin-bottom:4px}

/* simulations */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:10px}
.board-t{grid-column:1/-1;font-weight:800;font-family:var(--f-display);font-size:16px}
.slot{display:flex;flex-direction:column;gap:2px;text-align:start;border:2px dashed var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:58px}
.slot small{font-size:12px;color:var(--muted);font-weight:600}.slot b{font-size:15px;color:var(--muted);font-weight:600}
.slot.ready{border-color:var(--accent)}.slot.full{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}.slot.full b{color:var(--ok);font-weight:800}
.monitor{background:#0f2236;color:#d8f3ff;border:8px solid #1d2b3a;border-radius:10px;padding:14px;min-height:110px;font-size:15px}
.mon-out{font-size:22px;font-weight:700;margin-top:6px;min-height:1.4em}
.test-area{display:flex;flex-direction:column;gap:8px}
.track{position:relative;height:70px;background:var(--surface-2);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.bot{position:absolute;left:8px;top:10px;width:48px;height:48px;transition:left 2s ease-out;transform:rotate(90deg)}.bot svg{width:100%;height:100%}
.bot.go{left:calc(100% - 128px)}
.trk-wall{position:absolute;right:0;top:0;bottom:0;width:22px;background:repeating-linear-gradient(45deg,var(--muted) 0 6px,var(--line) 6px 12px)}
.beam{position:absolute;right:22px;top:33px;height:4px;width:58px;background:linear-gradient(90deg,transparent,#e05050);opacity:0;transition:opacity .3s}.beam.on{opacity:1}
.desk.sd{position:relative;aspect-ratio:auto;min-height:300px}
.desk.off{background:#05080c;color:#cfd8e2;display:grid;place-items:center;text-align:center;gap:10px;align-content:center;min-height:240px}
.wins{flex:1;display:flex;flex-wrap:wrap;gap:10px;padding:10px;align-content:flex-start}
.win2{background:#fff;color:#1b1b1b;border-radius:8px;overflow:hidden;flex:1 1 200px;box-shadow:0 4px 12px rgba(0,0,0,.25);min-width:0}
.win2-t{display:flex;align-items:center;justify-content:space-between;background:#e6ecf2;padding:2px 2px 2px 10px;padding-inline-start:10px;font-size:13px;font-weight:600}

.prog-start::after{content:"";position:absolute;bottom:-6px;inset-inline-start:16px;width:16px;height:7px;background:#e6a700;border-radius:0 0 4px 4px}
.btn.flag{background:#fff;color:#1b5e20;border:2px solid #4caf50}.btn.flag svg{display:block}
.stage{box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);background:linear-gradient(#f4f8ff,#e8f0fb)}

.mini{display:flex;flex-direction:column}.mini-ic{display:flex;gap:6px;padding:8px}.mini-ic svg{width:22px;height:22px}
.mini .win{inset:18% 22% 26% 22%;box-shadow:0 4px 10px rgba(0,0,0,.3)}

.mini-tb svg{width:14px;height:14px;display:block}.mini-vol{display:flex;align-items:center;gap:4px}.mini .vol{position:static;width:46px;height:5px}
.os-win{margin-top:12px;border:1px solid #c8d0d8;border-radius:10px;overflow:hidden;background:#f3f5f8;color:#1b1b1b;box-shadow:0 4px 14px rgba(0,0,0,.12)}

.os-nb{border:0;background:transparent;text-align:start;padding:8px 10px;border-radius:6px;font-size:13px;color:#1b1b1b;cursor:pointer}.os-nb[aria-pressed="true"]{background:#fff;font-weight:700;box-shadow:inset 3px 0 0 #2f78c4}.os-nb:disabled{opacity:.45;cursor:default}
.os-pane{padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}.os-pane h4{margin:0;font-size:17px}
.os-row{background:#fff;border:1px solid #e1e6eb;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.os-row .seg button{background:#f3f5f8;color:#1b1b1b}.os-row .seg button[aria-pressed=true]{background:#2f78c4;color:#fff;border-color:#2f78c4}
.os-row input[type=range]{accent-color:#2f78c4}
.b-tabs{display:flex;align-items:flex-end;gap:4px;background:#dfe3e8;padding:6px 8px 0}
.b-tab{display:flex;align-items:center;gap:6px;background:#fff;border-radius:8px 8px 0 0;padding:6px 10px;font-size:12px;color:#1b1b1b;max-width:200px;min-width:0}
.b-tabt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.b-fav svg{width:14px;height:14px;display:block}.b-x{font-size:10px;opacity:.6}
.b-plus{color:#555;padding:4px 6px}.b-tabs .aw-ctl{margin-inline-start:auto;color:#444;align-self:center;padding-bottom:4px}
.browser .b-bar{background:#fff;border-bottom:1px solid #e1e5ea}.b-reload{color:#555;font-size:16px;padding:0 2px}@media (max-width:480px){.b-reload{display:none}.b-go{padding:0 10px}.b-nav{width:34px}}
.b-addrw{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:#f1f3f5;border-radius:99px;padding:0 12px;height:36px}
.b-addrw .b-addr{border:0;background:transparent;height:34px;padding:0;flex:1;min-width:0;color:#1b1b1b}.b-lock{font-size:12px}

.toggle{justify-content:space-between}
.toggle input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;background:#c4ccd4;position:relative;cursor:pointer;transition:background .2s;flex:none;order:2}
.toggle input::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:right .2s}
.toggle input:checked{background:#2f78c4}.toggle input:checked::after{right:23px}
.sub.game{background:linear-gradient(#f3f0ff,#e9e4ff);border-color:#cfc5f5}
.mail{flex-direction:column}.mail-h{display:flex;align-items:center;gap:8px}.mail-h small{margin-inline-start:auto;color:var(--muted);font-size:11px}
.av{width:30px;height:30px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.mail p{background:var(--surface-2);border-radius:12px 12px 12px 4px;padding:8px 10px}
.ai-row span{background:#fff;color:#1b1b1b;border:1px solid #dfe5eb;border-radius:14px 14px 4px 14px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rec-app{background:#111827;color:#e5e7eb;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.rec-h{font-weight:700;align-self:stretch;text-align:center}
.rec-wave{display:flex;align-items:center;gap:3px;height:48px}.rec-wave i{display:block;width:4px;border-radius:2px;background:#ef4444;opacity:.85}
.rec-app audio{width:100%}.rec-pick{background:#ef4444!important;color:#fff!important}

.exam-task{border-top:5px solid var(--accent)}.exam-l{font-weight:700;color:var(--accent);margin:-6px 0 6px;font-size:14px}
.exam-info ul{margin:6px 0 0;padding-inline-start:20px}.exam-builder{border:2px solid var(--accent)}

.reveal .goals li[data-ok]::before{width:20px;height:20px;margin-top:3px;border-radius:50%;border:0;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.reveal .goals li[data-ok="1"]{color:var(--ok)}.reveal .goals li[data-ok="1"]::before{content:"✓";background:var(--ok)}
.reveal .goals li[data-ok="0"]{color:var(--bad)}.reveal .goals li[data-ok="0"]::before{content:"✗";background:var(--bad)}
.card.locked.reveal>*:has(.goals){opacity:1}.card.locked.reveal .goals{opacity:1}
.ex-fin{margin-top:12px;display:flex;flex-direction:column;gap:8px;opacity:1!important;pointer-events:auto!important}
.ex-res{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;border:2px solid}
.ex-res.ok{border-color:var(--ok);background:var(--ok-bg)}.ex-res.mid{border-color:var(--control);background:color-mix(in srgb,var(--control) 12%,var(--surface))}.ex-res.bad{border-color:var(--bad);background:var(--bad-bg)}
.ex-res-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.ex-pts{font-family:var(--f-display);font-weight:800;font-size:22px}
.exam-task.done{border-top-color:var(--ok)}

.last-try{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border:1.5px solid var(--sun);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.last-try b{font-size:16px}.last-try.banner{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= التصميم الحديث v2 ================= */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f1f4f9; --ink:#0f1b2d; --muted:#5f6f86; --line:#e3e8f0;
  --band:#0f1b2d; --band-ink:#ffffff; --band-muted:rgba(255,255,255,.78);
  --brand1:#1d6fb8; --brand2:#1f9e8a; --brand3:#3fb37a;
  --accent:#1d6fb8; --accent-ink:#ffffff; --teal:#1f9e8a; --sun:#ffc94a;
  --ok:#159a5b; --ok-bg:#e6f7ee; --bad:#d64545; --bad-bg:#fdecec;
  --wa:#159a5b; --grid:transparent;
  --f-display:"HNArabic",Tahoma,"Segoe UI",sans-serif; --f-body:"HNArabic",Tahoma,"Segoe UI",sans-serif;
  --r:22px; --shadow:0 1px 2px rgba(15,27,45,.05),0 10px 30px -12px rgba(15,27,45,.14);
  --grad:linear-gradient(135deg,var(--brand1),var(--brand2) 60%,var(--brand3));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1120; --surface:#111a2c; --surface-2:#172238; --ink:#e9eef7; --muted:#97a6bd; --line:#223049;
  --brand1:#3b8fdb; --brand2:#2bb59d; --brand3:#55c98f; --accent:#4c9be3; --accent-ink:#06121f; --teal:#2bb59d;
  --ok:#3fd18a; --ok-bg:#10321f; --bad:#ff7a7a; --bad-bg:#3a1a1d; --wa:#2fbf6c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1120; --surface:#111a2c; --surface-2:#172238; --ink:#e9eef7; --muted:#97a6bd; --line:#223049;
  --brand1:#3b8fdb; --brand2:#2bb59d; --brand3:#55c98f; --accent:#4c9be3; --accent-ink:#06121f; --teal:#2bb59d;
  --ok:#3fd18a; --ok-bg:#10321f; --bad:#ff7a7a; --bad-bg:#3a1a1d; --wa:#2fbf6c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.6);color-scheme:dark}
html,body{font-family:var(--f-body)}
body{background:var(--bg);background-image:radial-gradient(60% 40% at 100% 0%,color-mix(in srgb,var(--brand1) 14%,transparent),transparent 70%),radial-gradient(50% 35% at 0% 100%,color-mix(in srgb,var(--brand3) 12%,transparent),transparent 70%);background-repeat:no-repeat;background-size:100% 900px,100% 100%;-webkit-font-smoothing:antialiased}
#app{max-width:780px;padding-block:18px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.stack{gap:18px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand1) 55%,transparent);outline-offset:2px}

/* الرأس */
.band{background:var(--grad);color:#fff;border-radius:28px;padding:22px 22px 20px;box-shadow:0 18px 40px -18px color-mix(in srgb,var(--brand1) 70%,transparent);isolation:isolate}
.band::after{inset:0;width:auto;height:auto;opacity:.22;z-index:-1;background:radial-gradient(circle,#fff 1.6px,transparent 2px) 0 0/22px 22px;mask-image:linear-gradient(115deg,transparent 35%,#000 100%);-webkit-mask-image:linear-gradient(115deg,transparent 35%,#000 100%)}
.band-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.band .eyebrow{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:700;letter-spacing:0}
.moe{background:#fff;border-radius:18px;padding:8px 12px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.14);flex:0 0 auto}.moe img{height:64px;width:auto;display:block}
.band.compact .moe img{height:54px}
.band h1{font-size:clamp(30px,8vw,46px);font-weight:700;margin-top:4px;color:#fff}
.band .grade{color:rgba(255,255,255,.9);font-weight:400;font-size:17px}
.ids{padding-inline-end:0;gap:10px;margin-top:16px}
.id{border:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:10px 14px}
.id small{color:rgba(255,255,255,.75)}.id b{font-weight:700}
.teacher-band{background:linear-gradient(135deg,#4338ca,#6d28d9 55%,#a21caf)}
.teacher-band .grade{color:rgba(255,255,255,.9)}

/* البطاقات */
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.sec-t{margin-bottom:14px}.sec-t h2{font-size:21px}
.tag{background:color-mix(in srgb,var(--brand1) 10%,var(--surface));color:var(--brand1);border:0;font-weight:700;padding:4px 12px}

/* الأزرار */
.btn{border-radius:14px;background:var(--grad);color:#fff;font-weight:700;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--brand1) 80%,transparent);transition:transform .15s,box-shadow .15s,filter .15s;min-height:48px;padding:11px 20px}
.btn:hover{transform:translateY(-1px);filter:saturate(1.1)}.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:700}
.btn.teal{background:linear-gradient(135deg,var(--brand2),var(--brand3));color:#fff}
.btn.wa{background:linear-gradient(135deg,#12a35f,#1fbf7a);font-size:17px;box-shadow:0 10px 22px -12px #12a35f}
.btn[aria-disabled=true],.btn:disabled{opacity:.4;filter:grayscale(.4)}
.back{color:var(--muted);font-weight:700}.back:hover{color:var(--brand1)}

/* الحقول */
input[type=text],input[type=number],select,textarea{background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;transition:border-color .15s,background .15s}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand1);background:var(--surface)}
.field label{font-weight:700;font-size:13px}

/* التبويبات */
.tabs{background:var(--surface-2);border:0;border-radius:18px;padding:6px;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button{border-radius:14px;padding:11px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--brand1);box-shadow:var(--shadow)}

/* الترحيب والتقدم */
.avatar{background:var(--grad);color:#fff;border-radius:16px;width:48px;height:48px;font-weight:700}
.bar{height:12px;border:0;background:var(--surface-2)}.bar i{background:var(--grad)}

/* قائمة الدروس */
.unit-h{gap:10px;margin-top:10px}.unit-h h3{font-size:19px}
.unit-n{background:color-mix(in srgb,var(--brand2) 14%,var(--surface));color:var(--brand2);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.lesson{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.lesson:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand1) 40%,transparent)}
.lesson .dot{width:42px;height:42px;border-radius:14px;border:0;background:color-mix(in srgb,var(--brand1) 10%,var(--surface));color:var(--brand1);font-size:16px}
.lesson.proj{background:linear-gradient(135deg,color-mix(in srgb,var(--brand1) 6%,var(--surface)),color-mix(in srgb,var(--brand3) 8%,var(--surface)))}
.lesson.proj .dot{background:var(--grad);color:#fff}
.lesson.done .dot{background:var(--ok);color:#fff;border:0}
.lesson .score{background:var(--ok-bg);color:var(--ok);border-radius:99px;padding:3px 10px}
.lesson .tag{background:var(--grad);color:#fff}

/* صفحة الدرس */
.l-head .meta{color:var(--brand2);font-weight:700}
.l-head h1{font-size:clamp(30px,7.5vw,42px);font-weight:700}
.idea{background:linear-gradient(135deg,color-mix(in srgb,var(--brand1) 8%,var(--surface)),color-mix(in srgb,var(--brand3) 8%,var(--surface)));border:0;border-radius:20px;padding:16px 18px;position:relative}
.idea b{color:var(--brand1);font-size:13px;margin-bottom:2px}
.q{gap:10px}.q+.q{border-top:1px solid var(--line)}
.opt{border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;transition:border-color .15s,background .15s}
.opt:hover{border-color:color-mix(in srgb,var(--brand1) 45%,transparent)}
.opt.sel{border-color:var(--brand1);background:color-mix(in srgb,var(--brand1) 9%,var(--surface));color:var(--ink)}
.goals li::before{border-radius:6px}
.prompt{background:var(--grad);border-radius:14px}
.chip{border-radius:12px}.pool{border-radius:16px}

/* الإرسال والمراجعة */
.send{border:0;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border:2px solid transparent}
.big{color:var(--brand2);font-weight:700}
.parts span{background:var(--surface-2);border:0;font-weight:700}
.review{border:0;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border:2px solid transparent}
.rv-steps{border-radius:14px}
.seg button{border-radius:12px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--grad);border-color:transparent;color:#fff}
.seg.rate button{border-radius:99px;padding:9px 20px}
.rep-img{border-radius:20px}
.sent-banner{border-radius:16px}

/* الاختبار */
.exam-task{border-top:0;position:relative;overflow:hidden}
.exam-task::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#f97316,#f59e0b)}
.exam-task.done::before{background:linear-gradient(90deg,var(--ok),var(--brand3))}
.exam-l{color:#ea580c}
.exam-info{background:linear-gradient(135deg,color-mix(in srgb,#f97316 10%,var(--surface)),color-mix(in srgb,#f59e0b 10%,var(--surface)))}
.exam-info b{color:#ea580c}
.exam-builder{border:0;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#f97316,#f59e0b) border-box;border:2px solid transparent}
.ex-res{border-radius:16px}.last-try{border-radius:14px}
.toggle{border-radius:14px;border-color:var(--line)}
.foot{box-shadow:none;background:transparent;border-style:dashed}

/* الأفكار الجديدة */
.with-speak{display:flex;gap:8px;align-items:flex-start}.with-speak>:first-child{flex:1;min-width:0}
.speak{flex:none;display:inline-flex;align-items:center;gap:4px;border:0;background:color-mix(in srgb,var(--brand1) 10%,var(--surface));color:var(--brand1);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.speak.on{background:var(--grad);color:#fff;animation:pulse 1s infinite}
.idea-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.due{display:flex;flex-direction:column;gap:2px;border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--brand1) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--brand1) 35%,transparent)}
.due.soon{background:#fff4e0;border-color:#f59e0b;color:#7c4a03}.due.late{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.due-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.due-ctl label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;flex:1 1 200px;min-width:0}
.due-ctl .dt{background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:10px 12px;font:inherit;color:inherit}
.qr-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:12px}
.qr-link{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;cursor:pointer;border-radius:12px;transition:transform .15s,box-shadow .15s}.qr-link:hover,.qr-link:focus-visible{transform:scale(1.04);box-shadow:0 6px 18px rgba(29,111,184,.25)}.qr-hint{font-size:12px;color:var(--muted)}
.qr-img{width:132px;height:132px;image-rendering:pixelated;border-radius:8px;background:#fff;padding:4px}
.cert-img{width:100%;border-radius:14px;box-shadow:var(--shadow)}.cert-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.congrats{background:linear-gradient(135deg,#fff7d6,#ffe9b3);color:#5a3d00;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}

.band-top{align-items:flex-start}
.official{display:flex;flex-direction:column;gap:1px;line-height:1.45;min-width:0}
.official b{font-size:16px}.official span{font-size:12.5px;color:rgba(255,255,255,.88)}
.band .eyebrow{margin-top:10px}
.band.compact .official span{font-size:11.5px}

.rm-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rm-tabs{display:flex;flex-wrap:wrap;gap:8px}
.rm-tab{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.rm-tab.on{background:var(--brand1,#1d6fb8);border-color:transparent;color:#fff}
.rm-n{font-size:12px;background:rgba(0,0,0,.08);border-radius:999px;padding:1px 8px}.rm-tab.on .rm-n{background:rgba(255,255,255,.25)}
.rm-add{border-style:dashed;color:var(--brand1,#1d6fb8)}
.rm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:4px}
.rm-addrow{flex-wrap:nowrap}.rm-addrow input{flex:1;min-width:0}.rm-addrow .btn{flex:none;white-space:nowrap}
.rm-list{margin:0;padding:0 26px 0 0;display:grid;gap:6px;max-height:440px;overflow:auto}
.rm-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--surface-2)}

body.dash-mode{--v-green:#006C35;--v-teal:#00A19B;--v-mint:#7BC8A4;--v-navy:#14303f;--v-sand:#C9A961;background:linear-gradient(180deg,#eef6f2 0,#f6f8f7 340px)}

  const tick=()=>{if(!box.isConnected&&tick.started)return clearInterval(tick.t);tick.started=1;let s=Math.max(0,(prmEnd(end)-Date.now())/1000);const v={d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60)};cells.forEach(([k,b])=>b.textContent=ar(String(v[k]).padStart(2,'0')))};
  box.append(...cells.map(c=>c[2]));tick();tick.t=setInterval(tick,30000);return box}
/* p = {id,kind,tone,badge,title,text,points[],btn,link,end,countdown} */
function promoView(p,o){o=o||{};const T=PRM_TONES[p.tone]||PRM_TONES[(PRM_TONE_OPTS[p.kind]||['blue'])[0]];const pts=(p.points||[]).filter(Boolean).slice(0,3);
  const sty=`--prm-c:${T[0]};--prm-ink:${T[1]}`;
  if(p.kind==='bar'){return h('div',{class:'prm-bar',style:sty,role:'region','aria-label':'إعلان'},h('div',{class:'prm-bar-in'},prmIc(prmIco(p)),
      p.title?h('b',{},p.title):null,p.text?h('span',{},p.text):null,prmBtn(p,'prm-bar-a')),
    o.onClose?h('button',{type:'button',class:'prm-x','aria-label':'إغلاق الإعلان',html:PRM_I.x,onclick:o.onClose}):null)}
  const metas=pts.map(t=>h('li',{},prmIc('check'),t));
  const cd=p.countdown&&p.end?prmCountdown(p.end):null;
  if(p.kind==='card'){return h('section',{class:'prm-card',style:sty,'aria-label':p.title||'إعلان'},h('span',{class:'prm-deco','aria-hidden':'true'}),
      h('div',{class:'prm-main'},h('div',{class:'prm-tags'},h('span',{class:'prm-badge'},prmIc(prmIco(p)),p.badge||null),p.end?h('span',{class:'prm-tag'},prmIc('cal'),'حتى '+prmDate(p.end)):null),
        h('h2',{},p.title||''),p.text?h('p',{},p.text):null,metas.length?h('ul',{class:'prm-meta'},metas):null,
        p.btn?h('div',{class:'prm-acts'},prmBtn(p,'prm-cta')):null),
      cd?h('div',{class:'prm-side'},h('span',{},'يتبقى حتى الموعد'),cd):null)}
  /* تنبيه جانبي صغير لا يحجب الصفحة */
  const close=o.onClose?h('button',{type:'button',class:'prm-tclose','aria-label':'إغلاق التنبيه',html:PRM_I.x,onclick:()=>o.onClose()}):null;
  const later=o.onClose?h('button',{type:'button',class:'prm-later',onclick:()=>o.onClose()},'لاحقًا'):null;
  const cta=prmBtn(p,'prm-cta');if(cta&&o.onClose)cta.addEventListener('click',()=>o.onClose());
  return h('aside',{class:'prm-toast',style:sty,'aria-label':p.title||'تنبيه'},close,
    h('div',{class:'prm-trow'},h('span',{class:'prm-tico'},prmIc(prmIco(p))),
      h('div',{class:'prm-tbody'},p.badge?h('span',{class:'prm-kick'},p.badge):null,h('b',{class:'prm-ttl'},p.title||''),p.text?h('p',{},p.text):null,
        (p.end||pts.length)?h('ul',{class:'prm-tmeta'},p.end?h('li',{},prmIc('cal'),'حتى '+prmDate(p.end)):null,metas):null,
        cd,(cta||later)?h('div',{class:'prm-acts'},cta,later):null)))}

  const blank=()=>({kind:'bar',tone:'blue',icon:'bell',badge:'إشعار',title:'',text:'',points:[],btn:'',link:'',start:today,end:ymd(new Date(Date.now()+7*864e5)),countdown:false});
  let cur=blank(),editRow=0,data=[];
  const minis={bar:[['0','0','100%','12px','var(--c)']],card:[['8px','8px','calc(100% - 16px)','28px','#0f1b2d'],['14px','14px','30px','6px','var(--c)']],popup:[['6px','24px','46px','28px','#fff'],['10px','29px','12px','12px','var(--c)']]};
  const kindBtns=Object.keys(PRM_KINDS).map(k=>{const mini=h('span',{class:'prm-mini','aria-hidden':'true',style:'--c:#f08a24'},minis[k].map(([l,t,w,hh,bg])=>h('i',{style:`right:${l};top:${t};width:${w};height:${hh};background:${bg}`})));
    return h('button',{type:'button',class:'prm-kind','aria-pressed':'false','data-k':k,onclick:()=>{cur.kind=k;if(PRM_TONE_OPTS[k].indexOf(cur.tone)<0)cur.tone=PRM_TONE_OPTS[k][0];paint()}},mini,h('b',{},PRM_KINDS[k]),
      h('small',{},{bar:'أعلى كل الصفحات، للأخبار والتذكير',card:'في الصفحة الرئيسية، للأخبار والمناسبات المهمة',popup:'بطاقة صغيرة في زاوية الشاشة، لا تحجب الموقع'}[k]))});
  const tones=h('div',{class:'prm-tones'});

    fText=h('textarea',{rows:3,maxlength:400,placeholder:'مثال: الاختبار القصير للوحدة الثانية يوم الأحد، راجع الملخص قبله.',oninput:sync}),
    fPts=h('textarea',{rows:3,maxlength:260,placeholder:'اختياري — سطر لكل نقطة (حتى ٣ نقاط)\nمثال: للصف الخامس\nمدة الاختبار ١٠ دقائق',oninput:sync}),
    fBtn=inp('مثال: اقرأ الملخص، التفاصيل، سجّل الآن',30),fLink=inp('https://forms.gle/…  أو  #lessons',300,true),
    fStart=h('input',{type:'date',onchange:sync,oninput:sync}),fEnd=h('input',{type:'date',onchange:sync,oninput:sync}),fCd=h('input',{type:'checkbox',onchange:sync});
  const lab=(t,el,cls,hint)=>h('label',{class:'f'+(cls?' '+cls:'')},t,el,hint?h('small',{class:'note',style:'font-weight:400'},hint):null);
  const rowBadge=lab('الشارة',fBadge,null,'كلمة قصيرة تظهر فوق العنوان'),rowPts=lab('نقاط مختصرة (اختياري)',fPts,'full'),rowCd=h('label',{class:'full note',style:'display:flex;gap:8px;align-items:center;cursor:pointer'},fCd,'أظهر عدًّا تنازليًا حتى تاريخ الانتهاء (مفيد للمواعيد والمسابقات)');
  function sync(){Object.assign(cur,{badge:fBadge.value,title:fTitle.value,text:fText.value,points:fPts.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,3),btn:fBtn.value,link:fLink.value.trim(),start:fStart.value,end:fEnd.value,countdown:fCd.checked});drawPrev()}
  function fill(p){fBadge.value=p.badge||'';fTitle.value=p.title||'';fText.value=p.text||'';fPts.value=(p.points||[]).join('\n');fBtn.value=p.btn||'';fLink.value=p.link||'';fStart.value=p.start||'';fEnd.value=p.end||'';fCd.checked=!!p.countdown}
  function drawPrev(){const p=Object.assign({},cur);if(!p.title&&!(p.kind==='bar'&&p.text))p.title='عنوان الإعلان يظهر هنا';prev.replaceChildren(promoView(p))}
  function paint(){kindBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===cur.kind)));
    tones.replaceChildren(...PRM_TONE_OPTS[cur.kind].map(t=>h('button',{type:'button',class:'prm-tone','aria-pressed':String(t===cur.tone),'aria-label':'اللون: '+PRM_TONES[t][2],title:PRM_TONES[t][2],style:'background:'+PRM_TONES[t][0],onclick:()=>{cur.tone=t;paint()}})));
    const bar=cur.kind==='bar';rowBadge.hidden=bar;rowPts.hidden=bar;rowCd.hidden=bar;fTitle.placeholder=bar?'الجزء البارز، مثال: اختبار الوحدة الثانية يوم الأحد':'مثال: اختبار الوحدة الثانية يوم الأحد';drawPurp();drawPrev()}
  const saveB=h('button',{type:'button',class:'btn',onclick:save},'نشر في الموقع');
  const cancelB=h('button',{type:'button',class:'btn ghost',hidden:true,onclick:()=>reset()},'إلغاء التعديل');
  function reset(){cur=blank();editRow=0;fill(cur);saveB.textContent='نشر في الموقع';cancelB.hidden=true;paint()}
  async function call(op,extra){msg.className='msg';msg.textContent='جارٍ الحفظ…';try{const j=await adminCall(op,extra);if(j.status==='pin'){msg.className='msg bad';msg.textContent='رمز الإدارة غير صحيح.';return false}if(!j.ok){msg.className='msg bad';msg.textContent=j.message||'تعذّر الحفظ.';return false}
      msg.className=j.message?'msg ok':'msg';msg.textContent=j.message||'';data=j.promos||[];drawList();return true}catch(e){msg.className='msg bad';msg.textContent='تعذّر الاتصال بجدولك. تأكد أن كود الجدول محدَّث ومنشور بإصدار جديد.';return false}}
  async function save(){sync();if(!cur.title.trim()&&!(cur.kind==='bar'&&cur.text.trim())){fTitle.focus();msg.className='msg bad';msg.textContent='اكتب عنوان الإعلان.';return}
    if(cur.link&&!/^https?:\/\/|^#/.test(cur.link)){fLink.focus();msg.className='msg bad';msg.textContent='الرابط يجب أن يبدأ بـ https://';return}

  const status=p=>!p.active?['موقوف','']:p.start&&p.start>today?['مجدول — يبدأ '+p.start,'wait']:p.end&&p.end<today?['انتهى','']:['ظاهر الآن','on'];
  function drawList(){list.replaceChildren(...(data.length?data.map(p=>{const[st,c]=status(p);const del=(()=>{let armed=false;const b=h('button',{type:'button',class:'rm-del',onclick:()=>{if(!armed){armed=true;b.textContent='تأكيد؟';setTimeout(()=>{armed=false;b.textContent='حذف'},3000);return}call('promoDel',{row:p.row})}},'حذف');return b})();
      return h('div',{class:'prm-row'},h('span',{class:'prm-st '+c},st),h('span',{class:'tx'},h('b',{},p.title||p.text),h('small',{class:'note'},PRM_KINDS[p.kind]+(p.end?' · حتى '+p.end:''))),
        h('span',{class:'acts'},h('button',{type:'button',class:'btn ghost',onclick:()=>{cur=Object.assign(blank(),p);editRow=p.row;fill(cur);saveB.textContent='حفظ التعديل';cancelB.hidden=false;paint();form.scrollIntoView({behavior:'smooth',block:'start'})}},'تعديل'),
          h('button',{type:'button',class:'btn ghost',onclick:()=>call('promoToggle',{row:p.row})},p.active?'إيقاف':'تفعيل'),del))}):[h('p',{class:'note'},'لا توجد إعلانات بارزة بعد.')]))}
  const form=h('div',{class:'prm-form'},h('div',{class:'full stack',style:'gap:8px'},h('b',{},'١. نوع الإعلان'),purp),h('div',{class:'full stack',style:'gap:8px'},h('b',{},'٢. طريقة العرض'),h('div',{class:'prm-kinds'},kindBtns)),
    h('div',{class:'full stack',style:'gap:8px'},h('b',{},'٣. اللون'),tones),
    h('b',{class:'full'},'٤. المحتوى'),rowBadge,lab('العنوان',fTitle),lab('النص',fText,'full'),rowPts,
    lab('نص الزر',fBtn,null,'اتركه فارغًا إن لم تحتج زرًا'),lab('رابط الزر',fLink,null,'رابط درس أو مشروع أو صفحة أو نموذج'),
    lab('يبدأ الظهور',fStart),lab('ينتهي في',fEnd,null,'يختفي الإعلان تلقائيًا بعد هذا اليوم'),rowCd,
    h('div',{class:'full stack',style:'gap:8px'},h('b',{},'معاينة كما سيظهر في الموقع'),prev),
    h('div',{class:'full row',style:'gap:8px;flex-wrap:wrap'},saveB,cancelB),h('div',{class:'full'},msg));
  fill(cur);paint();if(SHEET_URL)call('promos');
  return h('section',{class:'card stack'},h('h2',{style:'font-size:20px'},'إعلان بارز (إشعار، موعد، تنبيه، تهنئة، مسابقة…)'),
    h('p',{class:'note'},'كل الأنواع لا تحجب الموقع ولا تُلزم الزائر بشيء: الشريط أعلى الصفحات ويُغلق بضغطة، والبطاقة في الصفحة الرئيسية، والتنبيه الجانبي يظهر مرة واحدة فقط لكل زائر في زاوية الشاشة. إن كان أكثر من إعلان من النوع نفسه ظاهرًا يظهر الأحدث.'),
    form,h('h3',{style:'font-size:17px;margin:10px 0 0'},'إعلاناتك البارزة'),list)}

function route(){const id=location.hash.slice(1);if(isTeacher())renderTeacher();else if(wantsTeacher())renderTeacherGate();else if(EXAM_IDS.length){if(isLate()&&LATE_MODE==='close'&&!progress[examKey(EXAM_IDS,EXAM_TOTAL)])renderClosed(EXAM_TITLE);else renderExam()}
  else if(ASSIGNED.length&&isLate()&&LATE_MODE==='close'&&(ASSIGNED.length===1?!progress[ASSIGNED[0]]:!ASSIGNED.includes(id)||!progress[id])){if(ASSIGNED.length===1||ASSIGNED.includes(id))renderClosed(LESSONS[ASSIGNED.includes(id)?id:ASSIGNED[0]].title);else renderAssigned()}else if(ASSIGNED.length){if(ASSIGNED.length===1)renderLesson(LESSONS[ASSIGNED[0]]);else if(ASSIGNED.includes(id))renderLesson(LESSONS[id]);else renderAssigned()}else if(REQUIRE_LINK)renderNeedLink();else if(LESSONS[id])renderLesson(LESSONS[id]);else renderHome();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
(function(){try{if(!SHEET_URL||!navigator.sendBeacon||isTeacher()||wantsTeacher())return;let n=0;try{if(!sessionStorage.getItem('rqm4:vs')){sessionStorage.setItem('rqm4:vs','1');n=1}}catch(e){}
