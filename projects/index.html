ين."],terms:[["الحاسب المحمول","حاسب خفيف يعمل ببطارية ويمكن حمله."],["شاشة اللمس","شاشة نتعامل معها بالأصابع أو بالقلم الإلكتروني."],["لوح الرسم الرقمي","أداة يرسم بها المصممون ويحوّلون رسمهم إلى الحاسب."],["كرة التتبع","فأرة مقلوبة نحرّك كرتها بالإصبع."],["نظارات الواقع الافتراضي","نظارات تعرض عالمًا افتراضيًا ثلاثي الأبعاد."]],sum:["أنواع الحاسب: المكتبي، والمحمول، واللوحي، والهاتف الذكي، ومنصات الألعاب.","لوحة اللمس بديل الفأرة في المحمول.","شاشة اللمس ولوح الرسم الرقمي وكرة التتبع أدوات تفاعلية.","لوحة الألعاب ونظارات وقفازات الواقع الافتراضي للألعاب والواقع الافتراضي."],task:{type:"sort",intro:"تدريبا ١ و٣ من الكتاب: صنّف كل عنصر: هل هو من أنواع أجهزة الحاسب، أم من أدوات الحاسب التفاعلية؟",buckets:["أنواع أجهزة الحاسب","أدوات الحاسب التفاعلية"],items:[["الحاسب المكتبي",0],["الحاسب المحمول",0],["الحاسب اللوحي",0],["الهاتف الذكي",0],["منصة ألعاب الفيديو",0],["لوحة اللمس",1],["شاشة اللمس",1],["لوح الرسم الرقمي",1],["كرة التتبع",1],["لوحة الألعاب",1],["نظارات الواقع الافتراضي",1],["قفازات الواقع الافتراضي",1]]},quiz:[["الأداة التي تحل محل الفأرة في الحاسب المحمول:","لوحة اللمس","كرة التتبع","لوحة الألعاب"],["يستخدم المصممون والرسامون غالبًا:","لوح الرسم الرقمي","نظارات الواقع الافتراضي","الهاتف الذكي"],["الأداة التي تشبه فأرة مقلوبة:","كرة التتبع","شاشة اللمس","الماسح الضوئي"]],sol:["أنواع الأجهزة: المكتبي، والمحمول، واللوحي، والهاتف الذكي، ومنصة ألعاب الفيديو.","الأدوات التفاعلية: لوحة اللمس، وشاشة اللمس، ولوح الرسم الرقمي، وكرة التتبع، ولوحة الألعاب، ونظارات وقفازات الواقع الافتراضي."]},{title:"أجزاء الحاسب",idea:"يتكوّن الحاسب من أجزاء رئيسة داخل وحدة النظام: اللوحة الأم، والمعالج، وذاكرة الوصول العشوائي، والقرص الصلب، ومزود الطاقة، ومحرك الأقراص. ونستخدم معه أجهزة تخزين خارجية وأجهزة إدخال وإخراج.",goals:["تحدد الأجزاء الرئيسة للحاسب داخل وحدة النظام.","تميّز أجهزة التخزين الداخلية والخارجية.","تميّز أجهزة الإدخال من أجهزة الإخراج.","تعرف الأنواع المختلفة للطابعات."],explain:["الأجزاء الرئيسة: اللوحة الأم (Motherboard) تتصل بها جميع الأجزاء، ووحدة المعالجة المركزية (CPU) عقل الحاسب تنفذ العمليات، وذاكرة الوصول العشوائي (RAM) تحفظ البيانات مؤقتًا أثناء العمل، والقرص الصلب (Hard Disk) جهاز التخزين الرئيس، ومزود الطاقة (Power Supply) يزود الأجزاء بالكهرباء، ومحرك الأقراص المضغوطة والرقمية (CD & DVD Drive).","أجهزة التخزين الخارجية تتيح نقل البيانات: وحدة الذاكرة الفلاشية، والأقراص المضغوطة (CD) والرقمية (DVD)، والقرص الصلب الخارجي، وبطاقات الذاكرة (SD وMicroSD).","أجهزة الإدخال تُدخل البيانات إلى الحاسب: لوحة المفاتيح، والفأرة، والميكروفون، والماسح الضوئي، وكاميرا الويب، والكاميرا الرقمية، وكاميرا الفيديو.","أجهزة الإخراج تعرض نتائج المعالجة: الشاشة، ومكبرات الصوت، وسماعات الرأس، والطابعات.","أنواع الطابعات: الطابعة النافثة للحبر (Inkjet) رخيصة وتطبع بالألوان، وطابعة الليزر (Laser) سريعة للأعداد الكبيرة، والطابعة ثلاثية الأبعاد (3D printer) تصنع مجسمات حقيقية."],terms:[["اللوحة الأم","اللوحة التي تتصل بها جميع أجزاء الحاسب."],["وحدة المعالجة المركزية","عقل الحاسب الذي ينفذ العمليات."],["ذاكرة الوصول العشوائي","ذاكرة تحفظ البيانات مؤقتًا أثناء العمل."],["القرص الصلب","جهاز التخزين الرئيس في الحاسب."],["الطابعة ثلاثية الأبعاد","طابعة تصنع مجسمات حقيقية."]],sum:["الأجزاء الرئيسة: اللوحة الأم، والمعالج، والذاكرة، والقرص الصلب، ومزود الطاقة.","التخزين الخارجي: الفلاشية، والأقراص، والقرص الخارجي، وبطاقات الذاكرة.","الإدخال: لوحة المفاتيح والفأرة والميكروفون والماسح والكاميرات.","الإخراج: الشاشة والسماعات والطابعات (نافثة، ليزر، ثلاثية الأبعاد)."],task:{type:"sort",intro:"تدريبات الكتاب: صنّف كل جزء: هل هو من الأجزاء الرئيسة داخل وحدة النظام، أم جهاز تخزين خارجي، أم جهاز إدخال، أم جهاز إخراج؟",buckets:["الأجزاء الرئيسة","التخزين الخارجي","أجهزة الإدخال","أجهزة الإخراج"],items:[["اللوحة الأم",0],["وحدة المعالجة المركزية",0],["ذاكرة الوصول العشوائي",0],["مزود الطاقة",0],["وحدة الذاكرة الفلاشية",1],["القرص الصلب الخارجي",1],["بطاقة الذاكرة",1],["الماسح الضوئي",2],["الميكروفون",2],["كاميرا الويب",2],["الشاشة",3],["الطابعة",3],["سماعات الرأس",3]]},quiz:[["عقل الحاسب الذي ينفذ العمليات:","وحدة المعالجة المركزية","مزود الطاقة","الشاشة"],["الطابعة التي تصنع مجسمات حقيقية:","الطابعة ثلاثية الأبعاد","طابعة الليزر","الطابعة النافثة للحبر"],["الذاكرة التي تحفظ البيانات مؤقتًا أثناء العمل:","RAM","القرص المضغوط","الفلاشية"]],sol:["الأجزاء الرئيسة: اللوحة الأم، والمعالج، والذاكرة RAM، ومزود الطاقة.","التخزين الخارجي: الفلاشية، والقرص الصلب الخارجي، وبطاقة الذاكرة.","الإدخال: الماسح الضوئي، والميكروفون، وكاميرا الويب.","الإخراج: الشاشة، والطابعة، وسماعات الرأس."]},{title:"الملفات والمجلدات",idea:"نتحقق من حجم الملف، وننشئ اختصارًا للوصول السريع، ونضغط الملفات والمجلدات لتوفير المساحة ثم نستخرجها، ونستخدم التخزين السحابي، ونستعيد الملفات المحذوفة من سلة المحذوفات.",goals:["تتحقق من حجم الملف.","تنشئ اختصارًا لملف أو مجلد على سطح المكتب وتحذفه.","تضغط المجلد وتستخرج محتوياته.","تتعامل مع سلة المحذوفات: استعادة وإفراغ."],explain:["حجم الملف هو المساحة التي يشغلها في وحدة التخزين، ويُقاس بالكيلوبايت (KB) والميجابايت (MB). للتحقق منه: نضغط بالزر الأيمن على الملف ← خصائص.","الاختصار أيقونة على سطح المكتب تفتح الملف أو المجلد بسرعة دون البحث عنه. لإنشائه: زر الفأرة الأيمن على الملف ← إرسال إلى ← سطح المكتب (إنشاء اختصار). وحذف الاختصار لا يحذف الملف الأصلي.","ضغط الملفات يقلل حجمها لتوفير المساحة وتسهيل إرسالها. لإنشاء مجلد مضغوط: زر الفأرة الأيمن ← إرسال إلى ← مجلد مضغوط (zipped). ولاستخراج المحتويات: زر الفأرة الأيمن ← استخراج الكل.","التخزين السحابي يحفظ ملفاتنا على الإنترنت لنصل إليها من أي جهاز، مثل جوجل درايف وون درايف.","نغيّر طريقة عرض الملفات من تبويب «عرض»: أيقونات كبيرة، أو قائمة، أو تفاصيل، ونرتبها حسب الاسم أو التاريخ أو الحجم.","سلة المحذوفات تحفظ الملفات المحذوفة، فنستطيع «استعادة» الملف إلى مكانه، أو «إفراغ سلة المحذوفات» لحذف كل ما فيها نهائيًا."],terms:[["حجم الملف","المساحة التي يشغلها الملف، بالكيلوبايت أو الميجابايت."],["الاختصار","أيقونة تفتح الملف أو المجلد بسرعة."],["المجلد المضغوط","مجلد مصغّر الحجم لتوفير المساحة."],["التخزين السحابي","حفظ الملفات على الإنترنت."],["استعادة","إرجاع الملف المحذوف من سلة المحذوفات إلى مكانه."]],sum:["حجم الملف من الخصائص، ويقاس بـ KB وMB.","الاختصار من: إرسال إلى ← سطح المكتب.","الضغط من: إرسال إلى ← مجلد مضغوط، والاستخراج من: استخراج الكل.","نستعيد الملفات من سلة المحذوفات أو نفرغها."],task:{type:"files",root:"🖥️ سطح المكتب",tools:["zip","shortcut","bin"],intro:"تدريبات الكتاب (٢ و٥ و٦): اضغط مجلد «مشروع» إلى مجلد مضغوط، وأنشئ اختصارًا لملف «الرياض الخضراء.docx» على سطح المكتب، ثم احذف «صورة قديمة.jpg» واستعدها من سلة المحذوفات.",start:[{n:"مشروع",t:"folder"},{n:"الرياض الخضراء.docx",parent:null},{n:"صورة قديمة.jpg"}],goals:[{k:"zip",folder:"مشروع"},{k:"shortcut",file:"الرياض الخضراء.docx"},{k:"restore",file:"صورة قديمة.jpg"}]},quiz:[["يُقاس حجم الملف بوحدة:","الكيلوبايت","المتر","الدرجة"],["حذف الاختصار يؤدي إلى:","حذف الأيقونة فقط ويبقى الملف الأصلي","حذف الملف الأصلي","حذف كل الملفات"],["لاستخراج محتويات مجلد مضغوط نختار:","استخراج الكل","إعادة تسمية","نسخ"]],sol:["حدّد «مشروع» واضغط «إرسال إلى مجلد مضغوط».","حدّد «الرياض الخضراء.docx» واضغط «إنشاء اختصار على سطح المكتب».","حدّد «صورة قديمة.jpg» واضغط «حذف»، ثم افتح «سلة المحذوفات» واضغط «استعادة»."]},{project:!0,title:"أجهزة التخزين عبر الزمن",idea:"مشروع الكتاب: تنظّم مع فريقك صور أجهزة التخزين القديمة والحديثة في مجلدات، وتضغط مجلد الأجهزة السابقة، وتنشئ اختصارًا لمجلد الأجهزة المستقبلية ثم تحذفه وتفرغ سلة المحذوفات.",goals:["تنشئ المجلدات وتنظّم الصور فيها.","تضغط المجلد وتنشئ الاختصار.","تحذف الاختصار وتفرغ سلة المحذوفات."],explain:["شكّل فريقًا وابحث في الإنترنت عن أجهزة التخزين التي كانت تُستخدم في الماضي، وتلك التي ستُستخدم في المستقبل.","١) أنشئ مجلدين على سطح المكتب: «أجهزة التخزين السابقة» و«أجهزة التخزين المستقبلية». ٢) احفظ الصور في المجلد المناسب. ٣) اضغط مجلد الأجهزة السابقة. ٤) أنشئ اختصارًا على سطح المكتب لمجلد الأجهزة المستقبلية. ٥) احذف الاختصار وأفرغ سلة المحذوفات."],terms:[],sum:["مجلدان: السابقة والمستقبلية.","اضغط مجلد الأجهزة السابقة.","اختصار ثم حذفه وإفراغ السلة."],task:{type:"files",root:"🖥️ سطح المكتب",tools:["zip","shortcut","bin"],intro:"أنشئ مجلدي «أجهزة التخزين السابقة» و«أجهزة التخزين المستقبلية»، وانقل كل صورة إلى مجلدها، ثم اضغط مجلد السابقة، وأنشئ اختصارًا لمجلد المستقبلية ثم احذفه، وأفرغ سلة المحذوفات.",start:[{n:"قرص مرن.jpg"},{n:"شريط كاسيت.jpg"},{n:"تخزين سحابي.jpg"},{n:"ذاكرة بلورية.jpg"}],goals:[{k:"folder",name:"أجهزة التخزين السابقة"},{k:"folder",name:"أجهزة التخزين المستقبلية"},{k:"move",file:"قرص مرن.jpg",to:"أجهزة التخزين السابقة"},{k:"move",file:"شريط كاسيت.jpg",to:"أجهزة التخزين السابقة"},{k:"move",file:"تخزين سحابي.jpg",to:"أجهزة التخزين المستقبلية"},{k:"move",file:"ذاكرة بلورية.jpg",to:"أجهزة التخزين المستقبلية"},{k:"zip",folder:"أجهزة التخزين السابقة"},{k:"delshort",file:"أجهزة التخزين المستقبلية"},{k:"empty"}]},quiz:[["نضغط المجلد قبل إرساله لأن الضغط:","يقلل حجمه","يحذفه","يغيّر اسمه"],["بعد حذف الاختصار يبقى:","المجلد الأصلي","لا شيء","سلة المحذوفات فارغة دائمًا"],["من أجهزة التخزين القديمة:","القرص المرن","التخزين السحابي","الذاكرة البلورية"]],sol:["أنشئ المجلدين بالاسمين المطلوبين.","انقل «قرص مرن» و«شريط كاسيت» إلى السابقة، والصورتين الأخريين إلى المستقبلية.","حدّد «أجهزة التخزين السابقة» واضغط «إرسال إلى مجلد مضغوط».","حدّد «أجهزة التخزين المستقبلية» واضغط «إنشاء اختصار»، ثم حدّد الاختصار واحذفه.","افتح «سلة المحذوفات» واضغط «إفراغ سلة المحذوفات»."]}]},{title:"التعامل مع المستندات",lessons:[{title:"الصور والرسومات",idea:"نضيف الصور إلى المستند من الإنترنت أو من جهاز الحاسب، وننسّقها ونتحكم في التفاف النص حولها، وندرج الأشكال ونكتب داخلها.",goals:["تدرج صورة من الإنترنت أو من جهاز الحاسب، وتحترم حقوق ملكيتها.","تعدّل الصورة وتنسّقها.","تتحكم في التفاف النص حول الصورة.","تدرج الأشكال وتكتب داخلها."],explain:["لإدراج صورة من الإنترنت: من تبويب «إدراج» ← مجموعة «رسومات توضيحية» ← «صور عبر الإنترنت»، نكتب كلمة البحث ونختار الصورة ثم «إدراج». تذكّر أن الصور محمية بحقوق الملكية، فلا تستخدم إلا الصور المسموح باستخدامها.","لإدراج صورة من جهاز الحاسب: إدراج ← صور ← هذا الجهاز، ثم نختار الصورة ونضغط «إدراج».","عند تحديد الصورة يظهر تبويب «تنسيق الصورة»: مجموعة «ضبط» لتعديل الألوان والسطوع، و«أنماط الصور» للإطارات والظلال، و«حجم» لتكبيرها وتصغيرها وقصها.","التفاف النص: «مع النص» تكون الصورة في سطر النص، و«مربع» يلتف النص حولها، و«محكم» يلتف النص حول حدودها، و«أعلى وأسفل» يكون النص فوقها وتحتها، و«خلف النص» و«أمام النص».","لإدراج شكل: إدراج ← أشكال، ونختار الشكل ونرسمه بالسحب، ثم نضغط عليه بالزر الأيمن ← «إضافة نص» لنكتب داخله."],terms:[["التفاف النص","طريقة ترتيب النص حول الصورة."],["تنسيق الصورة","تبويب يظهر عند تحديد الصورة ويحوي أدواتها."],["حقوق الملكية","حق صاحب الصورة في السماح باستخدامها أو منعه."],["الأشكال","رسومات جاهزة مثل الأسهم والدوائر ندرجها في المستند."]],sum:["ندرج الصور من الإنترنت أو من الجهاز، ونحترم حقوق الملكية.","تبويب «تنسيق الصورة» لتعديل الصورة.","التفاف «مربع» يجعل النص حول الصورة.","إدراج ← أشكال، ثم «إضافة نص» للكتابة داخل الشكل."],task:{type:"wordimg",intro:"تدريب ١ من الكتاب: أدرج صورة الصقر في المستند، واجعل النص يلتف حولها «مربع»، وضعها على اليسار.",heading:"الصقر العربي",text:"الصقر طائر جارح سريع، اشتهر به أهل الجزيرة العربية منذ القدم، ويُدرَّب على الصيد. ويتميز بحدة بصره وقوة مخالبه، وتقام له مهرجانات ومسابقات في المملكة.",goals:{img:"falcon",wrap:"مربع",align:"يسار"}},quiz:[["من أي تبويب ندرج الصورة أو الشكل؟","إدراج","تخطيط","مراجعة"],["أي التفاف يجعل النص يحيط بالصورة؟","مربع","مع النص","خلف النص"],["للكتابة داخل شكل نضغط عليه بالزر الأيمن ثم:","إضافة نص","حذف","نسخ"]],sol:["اضغط تبويب «إدراج» ثم «صور» واختر صورة «صقر».","من تبويب «تنسيق الصورة» اختر التفاف النص «مربع».","اختر الموضع «يسار»."]},{title:"التنسيق المتقدم",idea:"ننسّق الفقرات تنسيقًا متقدمًا: نحذف النص، ونكتب الحروف الكبيرة، ونغيّر تباعد الأسطر والمسافة البادئة وتباعد الأحرف، ونُظهر علامات التنسيق غير القابلة للطباعة.",goals:["تحذف النص بمفتاحي Delete وBackspace.","تكتب الحروف الإنجليزية الكبيرة بـ Caps Lock.","تغيّر تباعد الأسطر والمسافة البادئة وتباعد الأحرف.","تُظهر علامات التنسيق غير القابلة للطباعة وتخفيها."],explain:["مفتاح Delete يحذف الحرف الموجود بعد المؤشر، ومفتاح Backspace يحذف الحرف الموجود قبل المؤشر. ولكتابة حروف إنجليزية كبيرة نضغط Caps Lock مرة، ونضغطه مرة أخرى للعودة.","تباعد الأسطر: المسافة بين سطر وآخر. لتغييره: الشريط الرئيسي ← مجموعة «فقرة» ← زر «تباعد الأسطر والفقرات» ونختار 1.0 أو 1.5 أو 2.0.","المسافة البادئة: مسافة فارغة في بداية الفقرة تبعدها عن الهامش. نزيدها بزر «زيادة المسافة البادئة» وننقصها بزر «إنقاص المسافة البادئة».","تباعد الأحرف: من مجموعة «خط» ← خيارات متقدمة، نختار «موسّع» لزيادة المسافة بين الحروف أو «مضغوط» لتقليلها، ونغيّر «المقياس» و«الموضع».","نضغط Enter لإنشاء فقرة جديدة، ونضغط Shift + Enter لسطر جديد في الفقرة نفسها. ولإظهار العلامات غير القابلة للطباعة (¶ والمسافات): زر «إظهار/إخفاء ¶» أو Ctrl + Shift + 8."],terms:[["تباعد الأسطر","المسافة بين سطر وآخر."],["المسافة البادئة","مسافة فارغة في بداية الفقرة."],["تباعد الأحرف","المسافة بين الحروف: موسّع أو مضغوط."],["علامات التنسيق ¶","رموز تظهر على الشاشة ولا تُطبع، مثل نهاية الفقرة."]],sum:["Delete بعد المؤشر، وBackspace قبله.","تباعد الأسطر من مجموعة «فقرة».","زيادة المسافة البادئة تبعد الفقرة عن الهامش.","زر ¶ يُظهر علامات التنسيق ولا تُطبع."],task:{type:"format",file:"ظاهرة التسول",intro:"تدريب ١ من الكتاب: نسّق فقرات «ظاهرة التسول»: اجعل تباعد الأسطر 1.5، وزد المسافة البادئة مرة واحدة، وأظهر علامات التنسيق ¶.",text:`ظاهرة التسول في المجتمع

مي"],items:[["كتل معلومات غير متسلسلة",0],["إرشادات العمل على الحاسب",0],["خطوات إنتاج الخبز بالترتيب",1],["الجدول الزمني لرحلة",1],["دورة الماء في الطبيعة",2],["دورة حياة الفراشة",2],["المخطط التنظيمي للمدرسة",3],["شجرة عائلتي",3],["إيجابيات التقنية وسلبياتها",4],["هرم الغذاء",5]]},quiz:[["ندرج SmartArt من تبويب:","إدراج","مراجعة","تخطيط"],["لعرض دورة الماء في الطبيعة نختار النوع:","دائري","هرمي","قائمة"],["لتغيير ألوان SmartArt نستخدم:","تغيير الألوان","حذف","تدقيق إملائي"]],sol:["قائمة: كتل المعلومات غير المتسلسلة وإرشادات العمل.","معالجة: خطوات إنتاج الخبز والجدول الزمني.","دائري: دورة الماء ودورة حياة الفراشة.","هيكلي: المخطط التنظيمي وشجرة العائلة.","علاقة: إيجابيات التقنية وسلبياتها، وهرمي: هرم الغذاء."]},{title:"التدقيق والطباعة",idea:"قبل طباعة المستند ندققه: نصحح الأخطاء الإملائية والنحوية بأداة المحرر، ونبحث عن المرادفات، ثم نعاين الصفحة ونختار إعدادات الطباعة.",goals:["تدقق المستند وتصحح الأخطاء الإملائية والنحوية.","تبحث عن مرادفات الكلمات.","تعاين المستند قبل الطباعة وتختار إعداداتها."],explain:["في مايكروسوفت وورد يظهر خط أحمر متعرج تحت الكلمة ذات الخطأ الإملائي، وخط أزرق مزدوج تحت الخطأ النحوي.","للتدقيق: تبويب «مراجعة» ← مجموعة «تدقيق» ← «المحرر» (أو F7)، فتظهر الأخطاء مع اقتراحات لتصحيحها، فنختار الاقتراح أو نتجاهل.","للبحث عن مرادف كلمة: نحددها ثم «مراجعة» ← «قاموس المرادفات» (Shift + F7)، أو بالزر الأيمن ← مرادفات.","للطباعة: ملف ← طباعة (Ctrl + P)، فتظهر معاينة الطباعة على الجانب، ونختار الطابعة وعدد النسخ.","إعدادات الطباعة: طباعة كل الصفحات، أو الصفحة الحالية، أو صفحات مخصصة مثل 1-3، أو التحديد فقط، ونختار الاتجاه عموديًا أو أفقيًا."],terms:[["المحرر","أداة تدقق الأخطاء الإملائية والنحوية."],["قاموس المرادفات","أداة تقترح كلمات بالمعنى نفسه."],["معاينة الطباعة","رؤية شكل الصفحة قبل طباعتها."],["الاتجاه الأفقي","طباعة الصفحة بعرضها."]],sum:["الخط الأحمر خطأ إملائي، والأزرق خطأ نحوي.","مراجعة ← المحرر (F7) للتدقيق.","قاموس المرادفات Shift + F7.","ملف ← طباعة (Ctrl + P) للمعاينة والإعدادات."],task:{type:"text",intro:"تدريب ١ من الكتاب: في هذا المستند ثلاثة أخطاء إملائية. صححها، ثم احفظ المستند.",start:"ذهبت الى المدرسه مبكرا وقرات كتابا مفيدا",target:"ذهبت إلى المدرسة مبكرا وقرأت كتابا مفيدا"},quiz:[["الخط الأزرق المزدوج تحت الكلمة يعني:","خطأ نحوي","خطأ إملائي","رابط"],["اختصار فتح المحرر للتدقيق:","F7","F1","F12"],["لطباعة الصفحات من ١ إلى ٣ فقط نختار:","طباعة مخصصة","طباعة كل الصفحات","الصفحة الحالية"]],sol:["«الى» تُكتب «إلى».","«المدرسه» تُكتب «المدرسة» بتاء مربوطة.","«قرات» تُكتب «قرأت».","ثم احفظ المستند."]},{project:!0,title:"دليل سياحي عن المملكة",idea:"مشروع الكتاب: ما مدى معرفتك بالسياحة؟ تجمع مع فريقك صورًا ومعلومات عن وجهة سياحية في المملكة، وتنشئ مستندًا منسقًا فيه صور وأشكال ورسم SmartArt، ثم تدققه وتطبعه.",goals:["تجمع معلومات وصورًا عن وجهة سياحية.","تنسّق المستند تنسيقًا متقدمًا.","تدقق المستند قبل طباعته."],explain:["١) اجمع صورًا ومعلومات عن وجهة سياحية في المملكة من مصادر موثوقة. ٢) اكتب المعلومات في مستند وورد، وأدرج الصور والأشكال. ٣) نسّق المستند بالنص المنسق وأدرج رسم SmartArt مناسبًا. ٤) دقق المستند وتأكد من خلوه من الأخطاء، ثم اطبعه وقدّمه لمعلمك."],terms:[],sum:["اكتب العنوان ثم المعلومات بأسطر واضحة.","نسّق بتباعد أسطر ومسافة بادئة ومحاذاة.","دقق ثم اطبع."],task:{type:"format",intro:"اكتب في المربع دليلًا قصيرًا عن وجهة سياحية في المملكة: العنوان ثم ثلاث معلومات على الأقل، ثم نسّقه.",editable:!0,file:"دليلي السياحي",lineGoal:"اكتب العنوان وثلاث معلومات على الأقل (أربعة أسطر)",placeholder:`العُلا

يزورها السياح من كل العالم`,text:"",tools:["bold","size","color","align","spacing","indent","bullets"],goals:{bold:!0,spacing:"1.5",align:"يمين",bullets:!0}},quiz:[["قبل طباعة الدليل يجب:","تدقيقه من الأخطاء","حذف الصور","تغيير اسم الملف فقط"],["لعرض خطوات زيارة المكان بالترتيب نختار SmartArt من نوع:","معالجة","هرمي","دائري"],["الصور التي نضعها في الدليل يجب أن تكون:","مسموحًا باستخدامها","أي صورة من الإنترنت","بلا علاقة بالموضوع"]],sol:["اكتب العنوان ثم المعلومات كل واحدة في سطر.","حدّد الكل واضغط B.","اختر تباعد الأسطر 1.5 والمحاذاة لليمين.","اضغط زر التعداد النقطي."]}]},{title:"الوسائط المتعددة",lessons:[{title:"استخدام أجهزة الالتقاط وتحرير مقاطع الصوت",idea:"نتعرف أجهزة الالتقاط وطرق نقل البيانات منها إلى الحاسب، ووحدات حجم الملفات وامتداداتها، ثم نحرّر الصوت في برنامج أوداسيتي (Audacity): نقص ونضيف التأثيرات وندمج ونحفظ ونصدّر.",goals:["تتعرّف أجهزة الالتقاط: الهاتف المحمول والكاميرا الرقمية والماسح الضوئي والميكروفون.","تنقل البيانات من أجهزة الالتقاط إلى الحاسب.","تميّز وحدات قياس حجم الملفات وامتداداتها.","تحرّر مقطعًا صوتيًا في أوداسيتي: قص، وتلاشي، وتغيير السرعة، ودمج، وحفظ، وتصدير."],explain:["أجهزة الالتقاط تلتقط الأصوات والصور ومقاطع الفيديو وتحوّلها إلى بيانات رقمية: الهاتف المحمول، والكاميرا الرقمية، والماسح الضوئي (للصور والوثائق)، والميكروفون (للصوت).","ننقل البيانات إلى الحاسب بكيبل عبر منافذ التوصيل مثل USB وUSB-C وLightning، أو لاسلكيًا عبر البلوتوث وWi-Fi. ونستخدم الماسح الضوئي مع تطبيق «الفاكس والمسح الضوئي لويندوز».","وحدات قياس حجم الملفات من الأصغر: بايت، ثم كيلوبايت KB، ثم ميجابايت MB، ثم جيجابايت GB، ثم تيرابايت TB. ملف النص صغير، والصورة متوسطة، والفيديو كبير.","الامتداد يدل على نوع الملف: الصوت mp3 وwav، والصورة jpg وpng، والفيديو mp4، والمستند docx، والمضغوط zip.","في أوداسيتي: نحدد جزءًا من الموجة ونحذفه، ونضيف تأثير Fade In (تلاشي في البداية) أو Fade Out، ونغيّر السرعة من Effect ← Change Speed، وندمج ملفًا آخر من File ← Import ← Audio، ثم نحفظ المشروع ونصدّره من File ← Export as MP3."],terms:[["جهاز الالتقاط","جهاز يلتقط الصوت أو الصورة أو الفيديو ويحوّله إلى بيانات رقمية."],["الامتداد","حروف بعد اسم الملف تدل على نوعه، مثل mp3."],["الموجة الصوتية","شكل الصوت المرسوم في برنامج تحرير الصوت."],["التلاشي","ارتفاع الصوت أو انخفاضه تدريجيًا (Fade In / Fade Out)."],["التصدير","حفظ العمل في ملف بصيغة يمكن تشغيلها في أي جهاز، مثل MP3."]],sum:["الهاتف والكاميرا والماسح الضوئي والميكروفون أجهزة التقاط.","بايت < KB < MB < GB < TB.","الامتداد يحدد نوع الملف: mp3 صوت، jpg صورة، mp4 فيديو.","أوداسيتي: قص، تلاشي، سرعة، استيراد، حفظ، تصدير MP3."],task:{type:"audioedit",app:"أوداسيتي (Audacity) — تسجيلي.wav",tools:["fadein","speed","import","save"],imports:[{name:"أصوات الطيور",d:3}],intro:"تدريب ٧ من الكتاب: أنشئ مقطع الصوت الخاص بك. احذف الصمت في البداية والسعال، وأضف تأثير Fade In، وغيّر السرعة إلى ١٫٢٥، واستورد ملف «أصوات الطيور» لدمجه، ثم احفظ المشروع وصدّره بصيغة MP3.",segs:[{name:"صمت البداية",d:2,kind:"silence"},{name:"المقدمة",d:5,kind:"voice"},{name:"سعال",d:1,kind:"noise"},{name:"الخاتمة",d:4,kind:"voice"}],goals:[{k:"rm",name:"صمت البداية"},{k:"rm",name:"سعال"},{k:"keep",name:"المقدمة"},{k:"keep",name:"الخاتمة"},{k:"fadein"},{k:"speed",v:"1.25"},{k:"imp",name:"أصوات الطيور"},{k:"save"},{k:"export",fmt:"MP3"}]},quiz:[["أي مما يلي جهاز التقاط؟","الميكروفون","الطابعة","السماعات"],["أكبر وحدة لقياس حجم الملفات مما يلي:","تيرابايت TB","ميجابايت MB","كيلوبايت KB"],["الامتداد mp3 يدل على ملف:","صوتي","صورة","مستند"],["لدمج ملف صوتي آخر في أوداسيتي نختار:","File ثم Import ثم Audio","Effect ثم Fade In","Edit ثم Undo"],["تأثير Fade In يجعل الصوت:","يرتفع تدريجيًا في البداية","يتوقف فجأة","ينخفض في النهاية"]],sol:["اضغط مقطع «صمت البداية» ثم «احذف المقطع المحدد»، وكرر مع «سعال».","فعّل «تلاشي في البداية (Fade In)».","من قائمة السرعة اختر «السرعة × ١٫٢٥».","من «ملف › استيراد» اضغط «أصوات الطيور».","اضغط «حفظ المشروع».","اختر صيغة MP3 ثم اضغط «تصدير»."]},{title:"البحث عن الوسائط المتعددة وإنشاء وتحرير مقاطع الفيديو",idea:"نبحث عن الصور والفيديو في الإنترنت باحترام حقوق الملكية، ثم ننشئ فيديو في تطبيق صور مايكروسوفت: نضيف الصور إلى لوحة العمل، والتأثيرات ثلاثية الأبعاد والحركة والصوت والنص، ثم ننهي الفيديو ونصدّره.",goals:["تحترم قوانين حقوق الملكية عند استخدام الوسائط.","تبحث عن الصور والفيديو في الإنترنت وتحفظ الصورة.","تنشئ مشروع فيديو في تطبيق صور مايكروسوفت وترتب الصور في لوحة العمل.","تضيف التأثيرات ثلاثية الأبعاد والحركة والصوت والنص، ثم تصدّر الفيديو."],explain:["الصور والفيديو في الإنترنت محمية بحقوق الملكية، فلا نستخدمها إلا بإذن صاحبها أو إذا كانت برخصة المشاع الإبداعي (Creative Commons) التي تسمح باستخدامها.","للبحث عن صورة: نفتح مايكروسوفت إيدج ونكتب www.google.com.sa، ونكتب كلمة البحث ثم «صور»، ومن «الأدوات» نحدد الحجم و«حقوق الاستخدام». ولحفظ الصورة: زر الفأرة الأيمن ← «حفظ الصورة باسم». وللفيديو نضغط «فيديو».","في تطبيق صور مايكروسوفت: «محرر الفيديو» ← «مشروع فيديو جديد» ونكتب اسمه، ثم «إضافة» ← «من هذا الكمبيوتر»، ونضع الصور في لوحة العمل (Storyboard) بالترتيب الذي نريده.","نحدد صورة في لوحة العمل ونضيف «تأثيرات ثلاثية الأبعاد»، أو «الحركة» مثل التكبير والتحريك، ونضيف الصوت من «صوت مخصص» ← «إضافة ملف صوتي»، والعنوان من «نص».","في النهاية نضغط «إنهاء الفيديو» ونختار الجودة: عالية 1080p أو متوسطة 720p، ثم «تصدير»."],terms:[["حقوق الملكية","حق صاحب العمل في السماح باستخدامه أو منعه."],["المشاع الإبداعي","رخصة تسمح باستخدام العمل بشروط يحددها صاحبه."],["لوحة العمل","الجزء السفلي في محرر الفيديو نرتب فيه الصور والمقاطع (Storyboard)."],["التأثيرات ثلاثية الأبعاد","رسوم متحركة تضاف فوق المقطع مثل البالونات والشرارات."],["الحركة","تكبير الصورة أو تحريكها أثناء عرضها (Pan / Zoom)."]],sum:["استخدم الوسائط المسموح بها فقط، مثل المشاع الإبداعي.","ابحث من «الأدوات» بحسب الحجم وحقوق الاستخدام.","صور مايكروسوفت: مشروع جديد ← إضافة ← لوحة العمل.","أضف التأثيرات والحركة والصوت والنص، ثم «إنهاء الفيديو»."],task:{type:"video",app:"صور مايكروسوفت — محرر الفيديو: الحيوانات",board:"لوحة العمل",titleLabel:"نص (العنوان)",musicLabel:"صوت مخصص",fx:["بالونات","شرارات العدسة","فراشات","ثلج"],motion:["تكبير (Zoom)","تحريك (Pan)"],intro:"تدريب ٧ من الكتاب: أنشئ قصة متحركة. ضع الصور في ل : النسخ واللصق، والمضاعفة والتكرار، والحذف، والتراجع، وأدوات النموذج: التجميع والمحاذاة والانعكاس.","لإضافة شكل: من «الأشكال الأساسية» نسحب «صندوق» (Box) إلى مساحة العمل. ونغيّر حجمه بسحب المقابض البيضاء أو بكتابة القيمة بالمليمتر، ونرفعه بالمقبض الأسود على المحور Z، وندوّره بالأسهم المنحنية 90 درجة.","مثال الكتاب: نبني بيتًا: صندوق أحمر للجدران، وفوقه «سقف» (Roof) أخضر، وأسطوانة للمدخنة، ثم نضاعف السقف بأداة «المضاعفة والتكرار» وندوّره."],terms:[["النمذجة ثلاثية الأبعاد","إنشاء تمثيل رقمي لجسم بأبعاده الثلاثة."],["المحور Z","المحور الذي يمثل الارتفاع."],["مساحة العمل","الشبكة التي نبني عليها التصميم."],["المضاعفة والتكرار","أداة تنسخ الشكل وتكرر آخر تغيير عليه."]],sum:["X العرض، Y الطول، Z الارتفاع.","نسحب الشكل من لوحة الأشكال إلى مساحة العمل.","نغيّر الحجم بالمقابض البيضاء، ونرفع بالمقبض الأسود.","الأسهم المنحنية للتدوير، و«المضاعفة والتكرار» للنسخ."],task:{type:"model3d",tc:!0,file:"بيتي",intro:"ابنِ بيت الكتاب: أضف صندوقًا أحمر واجعل عرضه 40، وأضف سقفًا أخضر وضعه فوق الصندوق تمامًا ثم دوّره ٩٠°، وأضف أسطوانة للمدخنة.",goals:[{k:"has",t:"cube"},{k:"color",t:"cube",c:"أحمر"},{k:"size",t:"cube",dim:"w",v:40},{k:"has",t:"roof"},{k:"color",t:"roof",c:"أخضر"},{k:"rot",t:"roof"},{k:"on",top:"roof",base:"cube"},{k:"has",t:"cyl"}]},quiz:[["المحور الذي يمثل الارتفاع في الأشكال ثلاثية الأبعاد:","Z","X","Y"],["أي الأشكال ثلاثي الأبعاد؟","المكعب","المربع","المثلث"],["لرفع الشكل عن مساحة العمل نسحب:","المقبض الأسود","المقبض الأبيض","لوحة الأشكال"],["أداة تنسخ الشكل وتكرر آخر تغيير:","المضاعفة والتكرار","الحذف","التراجع"],["من تطبيقات النمذجة ثلاثية الأبعاد:","التصاميم المعمارية والطباعة ثلاثية الأبعاد","كتابة الرسائل","تسجيل الصوت"]],sol:["اضغط «＋ صندوق»، ولوّنه بالأحمر، واجعل «العرض X» ٤٠.","اضغط «＋ سقف» ولوّنه بالأخضر، ثم «تدوير ٩٠°».","اجعل «الارتفاع عن الأرض» للسقف ٣٠، وحرّك الموضع س وص حتى يكون فوق وسط الصندوق.","اضغط «＋ أسطوانة» للمدخنة."]},{title:"معالجة الأشكال ثلاثية الأبعاد",idea:"نصمم حامل المستلزمات المكتبية في تينكركاد: نستخدم أسطوانات وصناديق، ونجعل بعض الأشكال فراغًا (Hole)، ونحاذيها ونجمعها في شكل واحد، ونغيّر الألوان، ونستخدم مكعب العرض لتغيير زاوية النظر.",goals:["تصمم نموذجًا من عدة أشكال.","تميّز الأشكال الصلبة (Solid) من المفرغة (Hole).","تحاذي الأشكال (Align) وتجمعها (Group).","تغيّر ألوان الأشكال وتغيّر زاوية العرض بمكعب العرض."],explain:["نصمم حامل المستلزمات المكتبية من: قاعدة أسطوانية مسطحة، وأسطوانة طويلة للأقلام، وصندوق، ووتد (Wedge) للمساحات والأوراق.","الشكل الصلب (Solid) جسم ممتلئ. والشكل الفراغ (Hole) نستخدمه لنحفر به داخل شكل آخر، فعندما نجمعهما يختفي جزء من الشكل الصلب ويصبح مجوفًا.","أداة المحاذاة (Align) ترتب الأشكال المحددة بالنسبة لبعضها: إلى اليمين أو اليسار أو الوسط. نحدد الأشكال ثم نضغط «محاذاة» ونختار المقبض.","أداة التجميع (Group) تجمع الأشكال المحددة في شكل واحد. نحدد الأشكال بالسحب أو بالضغط مع Shift، ثم نضغط «تجميع».","مكعب العرض (ViewCube) يغيّر زاوية النظر: من الأعلى (TOP) أو الأمام (FRONT) أو الجوانب، فنرى التصميم من كل الجهات."],terms:[["الشكل الصلب","جسم ممتلئ في التصميم."],["الفراغ","شكل نحفر به داخل شكل آخر عند التجميع."],["المحاذاة","ترتيب الأشكال بالنسبة لبعضها."],["التجميع","جمع عدة أشكال في شكل واحد."],["مكعب العرض","أداة لتغيير زاوية النظر إلى التصميم."]],sum:["صلب (Solid) = ممتلئ، فراغ (Hole) = يحفر.","حدد الأشكال ثم «محاذاة» لترتيبها.","«تجميع» يجعلها شكلًا واحدًا.","مكعب العرض لتغيير زاوية النظر."],task:{type:"model3d",tc:!0,file:"حامل المستلزمات المكتبية",intro:"صمّم حامل الأقلام كما في الكتاب: أسطوانة قاعدة برتقالية مسطحة (عرض 60 وارتفاع 5)، وفوقها أسطوانة ثانية، وأسطوانة ثالثة تجعلها فراغًا لتجويف الحامل، ثم حاذِ الأشكال على الوسط وجمّعها.",goals:[{k:"has",t:"cyl",n:3},{k:"size",t:"cyl",dim:"w",v:60},{k:"size",t:"cyl",dim:"h",v:5},{k:"color",t:"cyl",c:"برتقالي"},{k:"on",top:"cyl",base:"cyl"},{k:"hole",t:"cyl"},{k:"align"},{k:"group"}]},quiz:[["الشكل الذي يُستخدم للحفر داخل شكل آخر:","الفراغ (Hole)","الصلب (Solid)","النص"],["لجمع عدة أشكال في شكل واحد نستخدم:","التجميع (Group)","الحذف","التدوير"],["لترتيب الأشكال على الوسط نستخدم:","المحاذاة (Align)","الانعكاس","النسخ"],["ل أولوية العمليات الحسابية والأقواس.","تستخدم الأس والنسبة المئوية.","تحسب فاتورة باستخدام مراجع الخلايا ونسخ المعادلة."],explain:["تبدأ كل معادلة في إكسل بعلامة يساوي (=)، ثم نكتب الأرقام أو مراجع الخلايا والعمليات: الجمع (+) والطرح (-) والضرب (*) والقسمة (/).","أولوية العمليات: ١) ما بين الأقواس، ٢) الأس، ٣) الضرب والقسمة من اليسار إلى اليمين، ٤) الجمع والطرح من اليسار إلى اليمين. مثال: =20+(12-2)*5 = 70، أما =20+12-2*5 = 22.","الأس (^): =3^2 تعني 3×3 = 9. والنسبة المئوية (%): =120*25% تعني ربع 120 = 30. ونستخدم «نمط النسبة المئوية» من مجموعة «رقم» لعرض الناتج بعلامة %.","مثال الكتاب «الفاتورة»: لكل منتج السعر والخصم والكمية، والسعر الإجمالي = (السعر - الخصم) × الكمية، فنكتب في E2: =(B2-C2)*D2.","بعد كتابة المعادلة في الخلية الأولى نسحب مقبض التعبئة (المربع الصغير أسفل الخلية) إلى الأسفل لنسخها، فتتغير المراجع تلقائيًا لكل صف."],terms:[["المعادلة","عملية حسابية تبدأ بعلامة = في الخلية."],["مرجع الخلية","اسم الخلية مثل B2، نستخدمه في المعادلة بدل الرقم."],["أولوية العمليات","ترتيب تنفيذ العمليات: الأقواس، الأس، الضرب والقسمة، الجمع والطرح."],["الأس","رفع العدد إلى قوة، ويُكتب ^."]],sum:["كل معادلة تبدأ بـ =.","الأقواس أولًا، ثم الأس، ثم × ÷، ثم + -.","^ للأس، و% للنسبة المئوية.","اسحب مقبض التعبئة لنسخ المعادلة."],task:{type:"sheet",file:"الفاتورة.xlsx",intro:"من مثال الكتاب: احسب «السعر الإجمالي» لكل منتج بالمعادلة (السعر - الخصم) × الكمية في E2 إلى E5، ثم احسب في B8 مساحة المربع بالأس (B7^2)، وفي B9 قيمة 25% من 120.",cols:["A","B","C","D","E"],rows:[["المنتج","السعر","الخصم","الكمية","السعر الإجمالي"],["خبز","1.11","0.02","4",""],["شعيرية","5.87","0.12","3",""],["دجاج","18.53","0.37","2",""],["تمر","14.22","0.28","2",""],["","","","",""],["ضلع المربع","6","","",""],["مساحة المربع",""],["25% من 120",""]],goals:[["E2",4.36],["E3",17.25],["E4",36.32],["E5",27.88],["B8",36],["B9",30]]},quiz:[["تبدأ المعادلة في إكسل بعلامة:","=","+","#"],["ناتج المعادلة =20+(12-2)*5 هو:","70","160","22"],["أول ما يُنفذ في أولوية العمليات:","ما بين الأقواس","الجمع","الطرح"],["الرمز ^ في  كرة القدم من 30 طالبًا نكتب:","=12/30","=12+30","=30-12"],["وسيلة الإيضاح توضح:","معنى كل لون","عدد الصفحات","اسم الطالب"]],sol:["اختر «دائري» من «إدراج».","اكتب العنوان «الرياضة المفضلة».","اضغط «وسيلة الإيضاح» و«تسميات البيانات»."]}]},{title:"قواعد البيانات",lessons:[{title:"مقدمة في قواعد البيانات",idea:"نميّز البيانات من المعلومات، ونتعرف أنواع البيانات: العددية والأبجدية والأبجدية العددية، ثم نتعرف قاعدة البيانات ومكوناتها: الجدول والسجل والحقل.",goals:["تميّز البيانات من المعلومات.","تميّز أنواع البيانات: العددية والأبجدية والأبجدية العددية.","تتعرّف قاعدة البيانات ومكوناتها: الجدول والسجل والحقل."],explain:["البيانات حقائق أولية موجودة حولنا بأشكال مختلفة، مثل الأرقام والحروف والرموز، وليس لها معنى مستقل، مثل: 1128 أو «الأربعاء». أما المعلومات فهي البيانات بعد معالجتها وتنظيمها فيصبح لها معنى، مثل: «تاريخ الميلاد 8/03/2022».","البيانات العددية تتكون من أرقام فقط، ويمكن إجراء العمليات الحسابية عليها، مثل 52 و6.25. والبيانات الأبجدية تتكون من حروف فقط، مثل «أحمد» و«الرياض». والبيانات الأبجدية العددية تجمع الحروف والأرقام والرموز، مثل «15 سبتمبر 2022» أو «A3».","قاعدة البيانات مجموعة من البيانات المترابطة المنظمة، تساعدنا على حفظها والبحث فيها وتحديثها بسهولة، مثل قاعدة بيانات طلاب المدرسة.","الجدول يحفظ البيانات في صفوف وأعمدة، ويحتوي على كل بيانات موضوع واحد، مثل جدول «الطلبة».","السجل صف واحد في الجدول يحوي كل البيانات عن شخص أو شيء واحد. والحقل عمود في الجدول يحوي نوعًا واحدًا من البيانات، مثل «الاسم» أو «رقم الهاتف»."],terms:[["البيانات","حقائق أولية ليس لها معنى مستقل."],["المعلومات","البيانات بعد معالجتها وتنظيمها فيصبح لها معنى."],["قاعدة البيانات","مجموعة بيانات مترابطة منظمة."],["السجل","صف في الجدول عن شخص أو شيء واحد."],["الحقل","عمود في الجدول فيه نوع واحد من البيانات."]],sum:["البيانات + المعالجة = المعلومات.","عددية: أرقام، أبجدية: حروف، أبجدية عددية: حروف وأرقام.","قاعدة البيانات ← جداول ← سجلات (صفوف) وحقول (أعمدة)."],task:{type:"sort",intro:"تدريب ٣ من الكتاب: صنّف كل مثال بحسب نوع البيانات.",buckets:["بيانات عددية","بيانات أبجدية","بيانات أبجدية عددية"],items:[["30.25",0],["1128",0],["الرياض",1],["سعد",1],["الفصول الأربعة",1],["إبريل ABR",2],["25 مايو 2023",2],["A3",2]]},quiz:[["البيانات بعد معالجتها وتنظيمها تسمى:","معلومات","حقولًا","رموزًا"],["البيانات التي تتكون من أرقام فقط:","عددية","أبجدية","أبجدية عددية"],["«15 سبتمبر 2022» من البيانات:","الأبجدية العددية","العددية","الأبجدية"],["الصف الذي يحوي بيانات طالب واحد يسمى:","سجلًا","حقلًا","جدولًا"],["عمود «رقم الهاتف» في الجدول يسمى:","حقلًا","سجلًا","قاعدة"]],sol:["العددية: 30.25 و1128.","الأبجدية: الرياض، سعد، الفصول الأربعة.","الأبجدية العددية: إبريل ABR، و25 مايو 2023، وA3."]},{title:"إنشاء قاعدة بيانات",idea:"ننشئ قاعدة بيانات بسيطة في مايكروسوفت إكسل: نكتب أسماء الحقول في الصف الأول، وندخل السجلات تحتها، وننسق البيانات كجدول، ونحذف السجلات غير المرغوبة.",goals:["تنشئ حقول قاعدة البيانات في إكسل.","تضيف السجلات إلى قاعدة البيانات.","تنسق البيانات كجدول.","تحدد السجلات وتحذفها."],explain:["يمكن إنشاء قاعدة بيانات بسيطة في مايكروسوفت إكسل، أو في برامج قواعد البيانات مثل مايكروسوفت أكسس. وقبل البدء نخطط: ما المعلومات التي نريد حفظها؟","لإنشاء الحقول: نفتح إكسل ونحدد الخلية A1، ونكتب اسم الحقل الأول «الاسم» ثم Tab، ونكتب بقية الحقول في الصف نفسه: اسم العائلة، والصف، والفصل، ورقم الهوية الوطنية، وتاريخ الميلاد.","لإضافة سجل: نحدد الخلية A2، ونكتب بيانات الطالب الأول، ونضغط Tab للانتقال بين الحقول. وكل طالب في صف جديد.","لتنسيق البيانات كجدول: نحدد البيانات، ثم من الشريط الرئيسي ← مجموعة «أنماط» ← «تنسيق كجدول» ← نختار نمطًا مثل «أخضر فاتح»، ونتأكد من تحديد «يحتوي الجدول على رؤوس» ثم «موافق».","لحذف سجل: نضغط رقم الصف لتحديده، ثم نضغط بزر الفأرة الأيمن ← «حذف». ولتحديد سجلات غير متجاورة نضغط Ctrl مع أرقام الصفوف."],terms:[["رؤوس الجدول","أسماء الحقول في الصف الأول من الجدول."],["تنسيق كجدول","أداة تعطي البيانات شكل جدول بألوان وأدوات فرز وتصفية."],["Tab","مفتاح ينقلنا إلى الخلية التالية في الصف."]],sum:["الحقول في الصف الأول.","كل سجل في صف.","«تنسيق كجدول» مع «يحتوي الجدول على رؤوس».","حدد رقم الصف ثم «حذف»."],task:{type:"xltable",file:"الطلبة.xlsx",cols:4,intro:"من مثال الكتاب: أنشئ جدول «الطلبة» في إكسل: اكتب الحقول الاسم، والصف، والفصل، وتاريخ الميلاد، ثم أدخل سجلين جديدين، ونسّق البيانات كجدول، واحذف سجل الطالب «وليد».",fields:["الاسم","الصف","الفصل","تاريخ الميلاد"],pre:[["وليد","6","1","7 يناير 2012"]],del:"وليد",goals:[{k:"fields"},{k:"recs",n:2},{k:"style"},{k:"del"}]},quiz:[["أين نكتب أسماء الحقول في إكسل؟","في الصف الأول","في العمود الأخير","في شريط العنوان"],["للانتقال إلى الخلية التالية في الصف نضغط:","Tab","Esc","Delete"],["أداة «تنسيق كجدول» في مجموعة:","أنماط","الحافظة","الخط"],["لتحديد سجلات غير متجاورة نضغط مع أرقام الصفوف مفتاح:","Ctrl","Alt","Enter"]],sol:["اكتب في الصف ١: الاسم، الصف، الفصل، تاريخ الميلاد.","املأ صفين فارغين ببيانات طالبين.","من «تنسيق كجدول» اختر نمطًا.","اضغط رقم صف «وليد» ثم «حذف الصف المحدد»."]},{title:"الفرز والتصفية",idea:"ننظم سجلات قاعدة البيانات في إكسل: نفرزها أبجديًا أو عدديًا تصاعديًا أو تنازليًا، ونصفّيها لنعرض السجلات التي تحقق شرطًا فقط، ثم نزيل التصفية.",goals:["تفرز البيانات أبجديًا من أ إلى ي ومن ي إلى أ.","تفرز البيانات العددية من الأصغر إلى الأكبر والعكس.","تصفّي السجلات لعرض بيانات محددة.","تزيل التصفية."],explain:["الفرز ترتيب البيانات وفق معيار محدد. الفرز الأبجدي التصاعدي من أ إلى ي، والتنازلي من ي إلى أ. والفرز العددي التصاعدي من الأصغر إلى الأكبر، والتنازلي من الأكبر إلى الأصغر.","للفرز: بعد تنسيق البيانات كجدول يظهر سهم بجانب كل رأس. نضغط سهم الحقل، مثل «الاسم»، ثم «فرز من أ إلى ي».","التصفية تعرض السجلات التي تحقق شرطًا وتخفي غيرها، ولا تحذفها. مثلًا نعرض طلاب الفصل 1 فقط.","للتصفية: نضغط سهم الحقل، مثل «رقم الفصل»، ونلغي «تحديد الكل»، ونختار القيمة المطلوبة ثم «موافق». ويظهر شكل قمع بجانب الحقل المصفّى.","لإزالة التصفية: نضغط سهم الحقل ثم «إلغاء تطبيق عامل التصفية»، فتظهر كل السجلات من جديد. ونجد أدوات «فرز وتصفية» أيضًا في الشريط الرئيسي."],terms:[["الفرز","ترتيب البيانات وفق معيار محدد."],["التصفية","عرض السجلات التي تحقق شرطًا وإخفاء غيرها."],["تصاعدي","من أ إلى ي، أو من الأصغر إلى الأكبر."],["تنازلي","من ي إلى أ، أو من الأكبر إلى الأصغر."]],s ط، ونرسم المخطط الانسيابي للقرار، ونكمل لعبة المتاهة: هل جمعت الدجاجة البيضة قبل الوصول إلى الوعاء؟",goals:["تستخدم لبنة «إذا ( ) فإن».","تستخدم لبنة «إذا ( ) فإن وإلا».","ترسم المخطط الانسيابي للقرار.","تكمل لعبة المتاهة باتخاذ قرار."],explain:["في برامج الحاسب نتخذ القرارات كما في الحياة اليومية: إذا كان الجو ممطرًا آخذ المظلة، وإلا لا آخذها.","لبنة «إذا ( ) فإن» تنفذ الأوامر داخلها إذا كان الشرط صحيحًا، وتتجاوزها إذا كان خطأ.","لبنة «إذا ( ) فإن وإلا» لها مسارين: الأوامر في الجزء الأول تُنفذ إذا كان الشرط صحيحًا، والأوامر بعد «وإلا» تُنفذ إذا كان الشرط خطأ.","في المخطط الانسيابي نرسم القرار بشكل المعين، ويخرج منه سهمان: «نعم» و«لا».","مثال الكتاب: عندما تصل الدجاجة إلى الوعاء، إذا كان counter = 1 (جمعت البيضة) تقول «أحسنت! جمعت البيضة»، وإلا تقول «ارجع واجمع البيضة»."],terms:[["إذا فإن وإلا","لبنة تختار بين مسارين حسب الشرط."],["المعين","شكل القرار في المخطط الانسيابي."]],sum:["«إذا» لمسار واحد.","«إذا وإلا» لمسارين.","المعين في المخطط الانسيابي للقرار."],task:{type:"fillcode",intro:"أكمل نهاية لعبة المتاهة كما في الكتاب: عندما تصل الدجاجة إلى الوعاء، إذا كان counter يساوي 1 تقول «أحسنت! جمعت البيضة»، وإلا تقول «ارجع واجمع البيضة».",lines:[{t:"انتظر حتى ملامس لـ Bowl؟",c:"control"},{t:"إذا (counter {0} 1) فإن",c:"control"},{t:"قل {1} لمدة ٢ ثانية",c:"looks",d:1},{t:"وإلا",c:"control"},{t:"قل {2} لمدة ٢ ثانية",c:"looks",d:1},{t:"{3}",c:"control"}],slots:[{opts:["=",">","<"],ok:"="},{opts:["أحسنت! جمعت البيضة","ارجع واجمع البيضة"],ok:"أحسنت! جمعت البيضة"},{opts:["أحسنت! جمعت البيضة","ارجع واجمع البيضة"],ok:"ارجع واجمع البيضة"},{opts:["أوقف الكل","كرر باستمرار","المظهر التالي"],ok:"أوقف الكل"}],win:"ممتاز! البرنامج يتخذ القرار الصحيح حسب قيمة العدّاد.",fail:"القرار غير صحيح. راجع المعامل والرسالتين."},quiz:[["لبنة تختار بين مسارين حسب الشرط:","إذا ( ) فإن وإلا","كرر","اذهب إلى"],["إذا كان الشرط خطأ في «إذا فإن وإلا» تُنفذ:","الأوامر بعد «وإلا»","الأوامر الأولى","لا شيء دائمًا"],["شكل القرار في المخطط الانسيابي:","المعين","المستطيل","البيضاوي"]],sol:["اختر «=».","بعد
